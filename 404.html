<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — WNH</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F1F0EC">
<style>
/* Deliberately self-contained. A 404 is served for any missing path at any
   depth, so relative asset links would resolve differently every time — this
   page can't safely reference the stylesheet at all. */
:root{--bg:#F1F0EC;--ink:#0B0D14;--muted:#6B6D74;--accent:#FF4326;--line:rgba(11,13,20,.13)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;
  display:flex;align-items:center;-webkit-font-smoothing:antialiased}
.wrap{max-width:1680px;margin:0 auto;padding:clamp(20px,4vw,64px);width:100%}
.mono{font-size:.6875rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(2.6rem,9vw,6.4rem);font-weight:500;letter-spacing:-.035em;line-height:1;
  margin:18px 0 0;text-transform:uppercase}
h1 span{color:var(--accent)}
p{margin:26px 0 0;max-width:36ch;color:var(--muted);font-size:1.05rem;line-height:1.6}
a.back{display:inline-flex;align-items:center;gap:9px;margin-top:44px;min-height:44px;
  padding:11px 20px;border:1px solid rgba(11,13,20,.26);border-radius:999px;
  font-size:.8125rem;font-weight:500;color:var(--ink);text-decoration:none;
  transition:background .3s,color .3s,border-color .3s}
a.back:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mono">Error &mdash; 404</div>
    <h1>Not<br><span>found</span></h1>
    <p>That page isn't here. It may have moved, or the link may be out of date.</p>
    <a class="back" id="home" href="./">
      <svg width="14" height="10" viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M5 1L1 5l4 4M1 5h13" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Back to the studio</span>
    </a>
  </div>
<script>
/* Walk back to the site root: on a project page that is /<repo>/, at a
   domain root it is /. Works without knowing either in advance. */
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var onGitHubPages = /\.github\.io$/i.test(location.hostname);
  document.getElementById('home').href = location.origin + '/' + (onGitHubPages && parts.length ? parts[0] + '/' : '');
})();
</script>
</body>
</html>
