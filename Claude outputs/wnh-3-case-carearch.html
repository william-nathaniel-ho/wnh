:root{
  /* ground */
  --bg:#F1F0EC;            /* warm paper */
  --surface:#FFFFFF;       /* cards, panels */
  --surface-2:#E7E5DF;     /* recessed */
  --ink:#0B0D14;           /* near-black, blue cast */
  --ink-2:#14161E;

  /* text */
  --text:#0B0D14;
  --text-2:#6B6D74;        /* 4.6:1 on paper */
  --on-ink:#F1F0EC;
  --on-ink-2:#9EA0A8;      /* 6.9:1 on ink */

  /* lines */
  --line:rgba(11,13,20,.13);
  --line-2:rgba(11,13,20,.26);
  --line-on-ink:rgba(241,240,236,.16);

  --accent:#FF4326;        /* marks, fills, large type */
  --accent-2:#C4321B;      /* the same red, darkened for small text on paper — 4.9:1 */

  /* type */
  --font:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;

  /* space */
  --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:64px; --s6:96px; --s7:140px; --s8:196px;
  --pad:clamp(18px,3.6vw,56px);
  --maxw:1560px;

  /* form */
  --r:8px; --r-lg:14px; --pill:999px;
  --ease:cubic-bezier(.22,1,.36,1);
  --dur:.8s;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:17px;line-height:1.6;font-weight:400;
  font-feature-settings:"ss01","cv05";
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img,video,svg{max-width:100%;display:block}
figure,blockquote{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--accent);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.skip{
  position:fixed;top:-100px;left:var(--pad);z-index:200;
  background:var(--ink);color:var(--on-ink);padding:12px 20px;border-radius:var(--pill);
  font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;transition:top .2s;
}
.skip:focus{top:12px}

/* ---------- primitives ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad)}
.sec{padding-block:clamp(var(--s6),10vw,var(--s8))}
.sec-tight{padding-block:clamp(var(--s5),7vw,var(--s7))}

.lab{
  font-size:.6875rem;font-weight:500;letter-spacing:.15em;
  text-transform:uppercase;line-height:1.4;color:var(--text-2);
}
.lab-ink{color:var(--on-ink-2)}
.muted{color:var(--text-2)}
.accent{color:var(--accent)}
/* small accent text on paper needs the darker red to clear 4.5:1 */
.lab.accent{color:var(--accent-2)}
.panel-ink .lab.accent,.step .n{color:var(--accent)}

.h-display{
  font-size:clamp(2.7rem,7.4vw,6.4rem);font-weight:500;
  letter-spacing:-.035em;line-height:1.0;margin:0;
}
.h-sec{
  font-size:clamp(1.9rem,4vw,3.2rem);font-weight:500;
  letter-spacing:-.03em;line-height:1.05;margin:0;
}

/* ---------- controls ---------- */

}

/* ==========================================================================

.nav{position:fixed;inset:0 0 auto 0;z-index:100;color:var(--text);transition:color .45s var(--ease)}

}

.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}

}

/* list view (work index) */

.case-title{font-size:clamp(2.2rem,6.4vw,5.4rem);font-weight:500;letter-spacing:-.035em;line-height:1.02;margin:var(--s3) 0 0;max-width:18ch}
.case-summary{margin:var(--s4) 0 0;max-width:44ch;font-size:clamp(1.05rem,1.8vw,1.45rem);line-height:1.5;color:var(--text-2)}
.case-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin-top:var(--s5);border-top:1px solid var(--line)}
@media(min-width:800px){.case-meta{grid-template-columns:repeat(4,1fr)}}
.case-meta div{padding:var(--s3) var(--s3) var(--s3) 0;border-bottom:1px solid var(--line)}
.case-meta dt{margin:0 0 7px;font-size:.6875rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--text-2)}
.case-meta dd{margin:0;font-size:1rem;font-weight:500;line-height:1.35}

.blocks{display:flex;flex-direction:column;gap:clamp(var(--s5),8vw,var(--s7))}
.media{position:relative;overflow:hidden;border-radius:var(--r-lg);background:var(--surface-2)}
.media img,.media video{width:100%;height:auto}
.ratio-16x9{aspect-ratio:16/9}
.ratio-4x5{aspect-ratio:4/5}
figcaption,.cap-line{margin-top:12px;font-size:.8125rem;color:var(--text-2)}
.blk-wide{max-width:1080px;margin-inline:auto}

.embed{position:relative;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;background:var(--ink)}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed-facade{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.embed-facade img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}
.play{
  position:relative;z-index:2;display:inline-flex;align-items:center;gap:11px;min-height:52px;
  padding:14px 24px;border-radius:var(--pill);background:var(--bg);color:var(--ink);
  font-size:.8125rem;font-weight:500;transition:background .3s var(--ease),color .3s var(--ease);
}
.embed-facade:hover .play{background:var(--accent);color:var(--ink)}

.blk-text{display:grid;grid-template-columns:1fr;gap:var(--s3)}
@media(min-width:900px){.blk-text{grid-template-columns:260px minmax(0,1fr);gap:var(--s5)}}
.blk-text h2{margin:0;font-size:1.35rem;font-weight:500;letter-spacing:-.02em}
.blk-text p{margin:0 0 1em;max-width:62ch;font-size:1.08rem;line-height:1.7}
.blk-text p:last-child{margin-bottom:0}

.blk-images{display:grid;gap:var(--s3);grid-template-columns:1fr}
@media(min-width:700px){.blk-images{grid-template-columns:repeat(2,1fr)}
  .blk-images.three{grid-template-columns:repeat(3,1fr)}}

.blk-quote blockquote{margin:0;max-width:22ch;font-size:clamp(1.7rem,4.2vw,3.2rem);font-weight:400;letter-spacing:-.03em;line-height:1.14}
.blk-quote cite{display:block;margin-top:var(--s3);font-style:normal;font-size:.8125rem;color:var(--text-2)}

.blk-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s4);padding:var(--s5) var(--s4);border-radius:var(--r-lg);background:var(--surface)}
@media(min-width:1000px){.blk-stats{grid-template-columns:repeat(4,1fr)}}
.stat b{display:block;font-size:clamp(2rem,4vw,3rem);font-weight:500;letter-spacing:-.04em;line-height:.95}
.stat span{display:block;margin-top:10px;font-size:.8125rem;color:var(--text-2)}

.credits{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media(min-width:700px){.credits{grid-template-columns:repeat(3,1fr)}}
.credit{padding:var(--s3) var(--s3) var(--s3) 0;border-bottom:1px solid var(--line)}
.credit dt{margin-bottom:6px;font-size:.6875rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--text-2)}
.credit dd{margin:0;font-size:1rem;font-weight:500}

.next{display:block;border-top:1px solid var(--line);padding-block:clamp(var(--s5),7vw,var(--s7));transition:color .4s var(--ease)}
.next:hover{color:var(--accent)}
.next .t{display:block;margin-top:var(--s2);font-size:clamp(1.8rem,6vw,4.4rem);font-weight:500;letter-spacing:-.035em;line-height:1.02}

/* ==========================================================================
   PORTFOLIO
   ========================================================================== */
.pf-roles{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s4)}
.pf-roles>span{font-size:.8125rem;font-weight:500;border:1px solid var(--line-2);border-radius:var(--pill);padding:9px 16px}
.deep{display:flex;flex-direction:column;gap:clamp(var(--s5),7vw,var(--s7))}
.deep-item{display:grid;grid-template-columns:1fr;gap:var(--s3)}
@media(min-width:900px){.deep-item{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s5);align-items:center}
  .deep-item:nth-child(even) .deep-media{order:2}}
.deep-media{aspect-ratio:4/3;border-radius:var(--r-lg);overflow:hidden;background:var(--surface-2)}
.deep-media>*{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.deep-media:hover>*{transform:scale(1.03)}
.deep-body h3{margin:10px 0 0;font-size:clamp(1.5rem,3vw,2.3rem);font-weight:500;letter-spacing:-.03em;line-height:1.06}
.deep-body p{margin:var(--s2) 0 0;color:var(--text-2);font-size:1.02rem;line-height:1.65;max-width:46ch}

.tools{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media(min-width:600px){.tools{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.tools{grid-template-columns:repeat(4,1fr)}}
.tool{padding:var(--s3) var(--s3) var(--s3) 0;border-bottom:1px solid var(--line)}
.tool h4{margin:0 0 8px;font-size:.6875rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--accent-2)}
.tool p{margin:0;font-size:.95rem;line-height:1.55;color:var(--text-2)}

.empty{padding:var(--s6) 0;text-align:center;color:var(--text-2)}
[hidden]{display:none !important}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .rv{opacity:1;transform:none}
}


/* ==========================================================================
   ENQUIRY DIALOG
   A mailto: loses most people at the point their mail client opens, so the
   button opens a form instead. Native <dialog> for focus handling and Esc.
   ========================================================================== */
.sheet-dlg{
  border:0;padding:0;background:transparent;max-width:min(560px,92vw);width:100%;
  color:var(--text);
}
.sheet-dlg::backdrop{background:rgba(11,13,20,.55);backdrop-filter:blur(6px)}
.sheet-dlg .enq,.sheet-dlg .enq-done{
  position:relative;background:var(--surface);border-radius:var(--r-lg);
  padding:clamp(26px,4vw,44px);box-shadow:0 30px 80px rgba(11,13,20,.24);
}
.sheet-dlg h2{
  margin:10px 0 0;font-size:clamp(1.5rem,3vw,2.1rem);font-weight:500;
  letter-spacing:-.03em;line-height:1.1;max-width:18ch;
}
.enq-note{margin:12px 0 var(--s4);color:var(--text-2);font-size:.95rem;line-height:1.55;max-width:44ch}
.enq-x{
  position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--text-2);
  transition:background .25s,color .25s;
}
.enq-x:hover{background:var(--bg);color:var(--text)}
.enq-f{margin-bottom:16px}
.enq-f label{
  display:block;margin-bottom:7px;font-size:.6875rem;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;color:var(--text-2);
}
.enq-f input,.enq-f textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  color:var(--text);padding:12px 14px;font:inherit;font-size:1rem;resize:vertical;
}
.enq-f input:focus,.enq-f textarea:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:transparent}
.enq-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.enq-err{min-height:22px;color:var(--accent-2);font-size:.875rem;line-height:1.4}
.enq-act{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:6px}
.enq-alt{font-size:.8125rem;color:var(--text-2);border-bottom:1px solid var(--line-2);padding-bottom:1px}
.enq-alt:hover{color:var(--text)}
.enq-send:disabled{opacity:.5;cursor:not-allowed}
</style>

          '<button class="foot-btn" data-contact>Start a project</button></div>' +
      '</div><div class="foot-bot lab">' +
        '<span>&copy; <span data-year></span> WNH</span><span data-locations></span>' +
      '</div></div></footer>';
  };

  /* any static link written as data-href="work/" is resolved against the base */
  W.links = function () {
    W.$$('[data-href]').forEach(function (a) { a.href = W.url(a.dataset.href); });
  };

  /* content-driven bits of the chrome */
  W.chrome = function (d) {
    var s = (d && d.site) || {};
    var mail = s.email || '';
    var subject = encodeURIComponent('Project enquiry — ' + (s.name || 'WNH'));

    W.$$('[data-mail]').forEach(function (el) { el.textContent = mail; });
    W.$$('[data-mailto]').forEach(function (el) { el.href = 'mailto:' + mail + '?subject=' + subject; });
    W.$$('[data-locations]').forEach(function (el) { el.textContent = (s.locations || []).join(' / '); });
    W.$$('[data-full]').forEach(function (el) { el.innerHTML = W.t(s.full || ''); });
    W.$$('[data-year]').forEach(function (el) { el.textContent = new Date().getFullYear(); });
  };

  /* --------------------------------------------------------------- menu */
  W.menu = function () {
    var burger = W.$('#burger');
    if (!burger) return;
    var set = function (open) {
      document.body.classList.toggle('menu', open);
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    };
    burger.addEventListener('click', function () { set(!document.body.classList.contains('menu')); });
    W.$$('#sheet a').forEach(function (a) { a.addEventListener('click', function () { set(false); }); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && document.body.classList.contains('menu')) { set(false); burger.focus(); }
    });
  };

  /* ------------------------------------------------------------- reveal */
  W.reduce = global.matchMedia('(prefers-reduced-motion: reduce)').matches;
  W.reveal = function () {
    var items = W.$$('.rv');
    if (W.reduce || !('IntersectionObserver' in global)) {
      items.forEach(function (el) { el.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        /* an element jumped clean past the viewport still has to appear, or a
           fast scroll leaves content permanently invisible */
        if (!e.isIntersecting && e.boundingClientRect.top > 0) return;
        var sibs = Array.prototype.slice.call(e.target.parentNode.children);
        e.target.style.transitionDelay = (Math.min(sibs.indexOf(e.target), 8) * 60) + 'ms';
        e.target.classList.add('in');
        io.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -10% 0px', threshold: 0.06 });
    items.forEach(function (el) { io.observe(el); });

    var busy = false;
    var sweep = function () {
      if (busy) return;
      busy = true;
      requestAnimationFrame(function () {
        busy = false;
        W.$$('.rv:not(.in)').forEach(function (el) {
          if (el.getBoundingClientRect().top < global.innerHeight * 0.94) {
            el.classList.add('in'); io.unobserve(el);
          }
        });
      });
    };
    global.addEventListener('scroll', sweep, { passive: true });
    global.addEventListener('resize', sweep, { passive: true });
    sweep();
  };

  /* the nav only gains its backdrop once the page has moved */
  W.meters = function () {
    var on = false;
    var check = function () {
      var should = global.scrollY > 24;
      if (should !== on) { on = should; document.body.classList.toggle('scrolled', on); }
    };
    check();
    global.addEventListener('scroll', function () { requestAnimationFrame(check); }, { passive: true });
  };

  /* click-to-load Vimeo, so one page never pulls four players at once */
  W.facades = function () {
    W.$$('.embed[data-vimeo]').forEach(function (box) {
      var facade = box.querySelector('.embed-facade');
      if (!facade) return;
      facade.addEventListener('click', function () {
        var f = document.createElement('iframe');
        f.src = W.vimeoSrc(box.dataset.vimeo, true);
        f.allow = 'autoplay; fullscreen; picture-in-picture';
        f.setAttribute('allowfullscreen', '');
        f.title = box.dataset.title || 'Video';
        box.innerHTML = '';
        box.appendChild(f);
      });
    });
  };


  /* ------------------------------------------------------------- enquiry
     A real form rather than a mailto: most people never finish a mailto —
     it opens a client they may not use. Posts to site.contact.endpoint
     (a Formspree URL or any endpoint that accepts JSON); with no endpoint
     set it falls back to composing the mail, so the button always works. */
  W.contact = function (d) {
    var s = (d && d.site) || {};
    var c = s.contact || {};
    var mail = s.email || '';

    var dlg = document.createElement('dialog');
    dlg.className = 'sheet-dlg';
    dlg.innerHTML =
      '<form method="dialog" class="enq" novalidate>' +
        '<button class="enq-x" value="cancel" aria-label="Close">' +
          '<svg width="15" height="15" viewBox="0 0 14 14" fill="none" aria-hidden="true">' +
          '<path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.4"/></svg></button>' +
        '<div class="lab">Start a project</div>' +
        '<h2>Tell me what you\'re making.</h2>' +
        '<p class="enq-note">' + W.esc(c.note || '') + '</p>' +
        '<div class="enq-f"><label for="enq-name">Name</label>' +
          '<input id="enq-name" name="name" type="text" autocomplete="name" required></div>' +
        '<div class="enq-f"><label for="enq-email">Email</label>' +
          '<input id="enq-email" name="email" type="email" autocomplete="email" required></div>' +
        '<div class="enq-f"><label for="enq-msg">Message</label>' +
          '<textarea id="enq-msg" name="message" rows="5" required></textarea></div>' +
        '<div class="enq-hp" aria-hidden="true">' +
          '<label>Leave this empty<input name="company" tabindex="-1" autocomplete="off"></label></div>' +
        '<div class="enq-err" role="alert"></div>' +
        '<div class="enq-act">' +
          '<button type="submit" class="pill pill-solid enq-send">Send</button>' +
          '<a class="enq-alt" href="mailto:' + W.esc(mail) + '">or email directly</a>' +
        '</div>' +
      '</form>' +
      '<div class="enq-done" hidden>' +
        '<div class="lab">Sent</div>' +
        '<h2>Thanks — I\'ll come back to you.</h2>' +
        '<p class="enq-note">Usually within two working days.</p>' +
        '<button class="pill enq-close">Close</button>' +
      '</div>';
    document.body.appendChild(dlg);

    var form = dlg.querySelector('.enq');
    var err = dlg.querySelector('.enq-err');
    var send = dlg.querySelector('.enq-send');

    var open = function () {
      err.textContent = '';
      if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
      var f = dlg.querySelector('#enq-name');
      if (f) setTimeout(function () { f.focus(); }, 40);
    };
    var close = function () {
      if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open');
    };

    W.$$('[data-contact]').forEach(function (b) {
      b.addEventListener('click', function (e) { e.preventDefault(); open(); });
    });
    dlg.querySelector('.enq-x').addEventListener('click', function (e) { e.preventDefault(); close(); });
    dlg.querySelector('.enq-close').addEventListener('click', close);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) close(); });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      var data = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        message: form.message.value.trim()
      };
      if (form.company.value) return;                    /* honeypot */
      if (!data.name || !data.email || !data.message) {
        err.textContent = 'Name, email and a message, please.'; return;
      }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)) {
        err.textContent = 'That email address does not look right.'; return;
      }

      if (!c.endpoint) {
        /* no endpoint configured — hand it to the mail client with the
           fields already filled, so nothing the person typed is lost */
        location.href = 'mailto:' + mail +
          '?subject=' + encodeURIComponent('Project enquiry — ' + data.name) +
          '&body=' + encodeURIComponent(data.message + '\n\n— ' + data.name + ' (' + data.email + ')');
        return;
      }

      send.disabled = true; send.textContent = 'Sending…';
      fetch(c.endpoint, {
        method: 'POST',
        headers: { 'content-type': 'application/json', accept: 'application/json' },
        body: JSON.stringify(data)
      }).then(function (r) {
        if (!r.ok) throw new Error('Send failed (' + r.status + ')');
        form.hidden = true;
        dlg.querySelector('.enq-done').hidden = false;
        dlg.querySelector('.enq-close').focus();
      }).catch(function (e2) {
        err.textContent = e2.message + ' — you can email directly instead.';
      }).finally(function () {
        send.disabled = false; send.textContent = 'Send';
      });
    });
  };

  W.boot = function (render) {
    W.shell();
    W.links();
    W.menu();
    W.load().then(function (d) {
      W.chrome(d);
      if (render) render(d);
      W.contact(d);
      W.reveal();
      W.meters();
      W.facades();
      document.body.classList.add('loaded');
    }).catch(function (err) {
      console.error('WNH: could not load content.json', err);
      document.body.classList.add('loaded');
    });
  };

  global.WNH = W;
})(window);
</script>
<script>
WNH.boot(function (d) {
  var W = WNH;
  var slug = new URLSearchParams(location.search).get('p');
  var p = slug && W.project(slug);

  if (!p) { W.$('#missing').hidden = false; return; }
  W.$('#case').hidden = false;

  document.title = p.title + ' — ' + p.client + ' — WNH';
  W.$('#c-client').innerHTML = W.t(p.client);
  W.$('#c-title').innerHTML = W.t(p.title);
  W.$('#c-summary').textContent = p.summary || '';

  W.$('#c-meta').innerHTML = [
    ['Client', W.t(p.client)], ['Year', W.esc(p.year)],
    ['Discipline', (p.disciplines || []).map(W.esc).join(', ')], ['Role', W.t(p.role || '—')]
  ].map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>'; }).join('');

  function media(src, alt, ratio) {
    if (W.cld.ok(src)) {
      return '<img src="' + W.cld.img(src, 1920) + '" srcset="' + W.cld.srcset(src) +
             '" sizes="100vw" alt="' + W.esc(alt || '') + '" loading="lazy" decoding="async">';
    }
    return '<div class="ph ratio-' + (ratio || '16x9') + '" data-tone="' + W.esc(p.tone || 'wine') + '"></div>';
  }
  function cap(text) { return text ? '<figcaption>' + W.t(text) + '</figcaption>' : ''; }

  var R = {
    text: function (b) {
      return '<div class="blk-text"><h2>' + W.t(b.heading || '') + '</h2><div>' +
        String(b.body || '').split(/\n{2,}/).map(function (x) { return '<p>' + W.t(x) + '</p>'; }).join('') +
        '</div></div>';
    },
    image: function (b) {
      return '<figure class="' + (b.size === 'wide' ? 'blk-wide' : '') + '">' +
        '<div class="media">' + media(b.src, b.alt, b.ratio) + '</div>' + cap(b.caption) + '</figure>';
    },
    images: function (b) {
      var items = b.items || [];
      return '<figure><div class="blk-images' + (items.length === 3 ? ' three' : '') + '">' +
        items.map(function (it) { return '<div class="media">' + media(it.src, it.alt, '4x5') + '</div>'; }).join('') +
        '</div>' + cap(b.caption) + '</figure>';
    },
    video: function (b) {
      if (!W.cld.ok(b.src)) return R.image({ src: '', alt: b.caption, caption: b.caption });
      return '<figure><div class="media"><video src="' + W.cld.video(b.src) + '"' +
        (W.cld.ok(b.poster) ? ' poster="' + W.cld.poster(b.poster) + '"' : '') +
        ' controls playsinline preload="metadata"></video></div>' + cap(b.caption) + '</figure>';
    },
    vimeo: function (b) {
      if (!W.vimeoId(b.url)) {
        return '<figure><div class="embed"><div class="embed-facade">' +
          '<span class="play">Vimeo link not set yet</span></div></div>' + cap(b.caption) + '</figure>';
      }
      /* a facade, not a live iframe — four players on one page is a slow page */
      return '<figure><div class="embed" data-vimeo="' + W.esc(b.url) + '" data-title="' +
        W.esc(b.caption || p.title) + '"><div class="embed-facade" role="button" tabindex="0">' +
        '<span class="play"><svg width="11" height="13" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true">' +
        '<path d="M0 0l12 7-12 7z"/></svg> Play</span></div></div>' + cap(b.caption) + '</figure>';
    },
    quote: function (b) {
      return '<div class="blk-quote"><blockquote>' + W.t(b.text || '') + '</blockquote>' +
        (b.attribution ? '<cite>' + W.t(b.attribution) + '</cite>' : '') + '</div>';
    },
    stats: function (b) {
      return '<div class="blk-stats">' + (b.items || []).map(function (s) {
        return '<div class="stat"><b>' + W.t(s.value) + '</b><span>' + W.t(s.label) + '</span></div>';
      }).join('') + '</div>';
    }
  };

  W.$('#c-blocks').innerHTML = (p.blocks || []).map(function (b) {
    var fn = R[b.type];
    if (!fn) { console.warn('WNH: unknown block type', b.type); return ''; }
    return '<div class="rv">' + fn(b) + '</div>';
  }).join('');

  if ((p.credits || []).length) {
    W.$('#c-credits-wrap').hidden = false;
    W.$('#c-credits').innerHTML = p.credits.map(function (c) {
      return '<div class="credit"><dt>' + W.t(c.role) + '</dt><dd>' + W.t(c.name) + '</dd></div>';
    }).join('');
  }

  var all = W.projects();
  var next = all[(all.indexOf(p) + 1) % all.length];
  W.$('#c-next').href = W.url('work/case.html?p=' + encodeURIComponent(next.slug));
  W.$('#c-next-title').innerHTML = W.t(next.title);

  W.$$('.embed-facade').forEach(function (f) {
    f.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f.click(); }
    });
  });
});
</script>
</body>
</html>
