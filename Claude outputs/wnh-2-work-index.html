:root{
  /* ground */
  --bg:#F1F0EC;            /* warm paper */
  --surface:#FFFFFF;       /* cards, panels */
  --surface-2:#E7E5DF;     /* recessed */
  --ink:#0B0D14;           /* near-black, blue cast */
  --ink-2:#14161E;

  /* text */
  --text:#0B0D14;
  --text-2:#6B6D74;        /* 4.6:1 on paper */
  --on-ink:#F1F0EC;
  --on-ink-2:#9EA0A8;      /* 6.9:1 on ink */

  /* lines */
  --line:rgba(11,13,20,.13);
  --line-2:rgba(11,13,20,.26);
  --line-on-ink:rgba(241,240,236,.16);

  --accent:#FF4326;        /* marks, fills, large type */
  --accent-2:#C4321B;      /* the same red, darkened for small text on paper — 4.9:1 */

  /* type */
  --font:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;

  /* space */
  --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:64px; --s6:96px; --s7:140px; --s8:196px;
  --pad:clamp(18px,3.6vw,56px);
  --maxw:1560px;

  /* form */
  --r:8px; --r-lg:14px; --pill:999px;
  --ease:cubic-bezier(.22,1,.36,1);
  --dur:.8s;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:17px;line-height:1.6;font-weight:400;
  font-feature-settings:"ss01","cv05";
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img,video,svg{max-width:100%;display:block}
figure,blockquote{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--accent);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.skip{
  position:fixed;top:-100px;left:var(--pad);z-index:200;
  background:var(--ink);color:var(--on-ink);padding:12px 20px;border-radius:var(--pill);
  font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;transition:top .2s;
}
.skip:focus{top:12px}

/* ---------- primitives ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad)}
.sec{padding-block:clamp(var(--s6),10vw,var(--s8))}
.sec-tight{padding-block:clamp(var(--s5),7vw,var(--s7))}

.lab{
  font-size:.6875rem;font-weight:500;letter-spacing:.15em;
  text-transform:uppercase;line-height:1.4;color:var(--text-2);
}
.lab-ink{color:var(--on-ink-2)}
.muted{color:var(--text-2)}
.accent{color:var(--accent)}
/* small accent text on paper needs the darker red to clear 4.5:1 */
.lab.accent{color:var(--accent-2)}
.panel-ink .lab.accent,.step .n{color:var(--accent)}

.h-display{
  font-size:clamp(2.7rem,7.4vw,6.4rem);font-weight:500;
  letter-spacing:-.035em;line-height:1.0;margin:0;
}
.h-sec{
  font-size:clamp(1.9rem,4vw,3.2rem);font-weight:500;
  letter-spacing:-.03em;line-height:1.05;margin:0;
}

/* ---------- controls ---------- */
.pill{

}

}

/* ==========================================================================

   ========================================================================== */
.nav{position:fixed;inset:0 0 auto 0;z-index:100;color:var(--text);transition:color .45s var(--ease)}
/* the homepage hero is dark media, so the nav inverts until the page moves */

.nav::before{

}

/* ==========================================================================

   ========================================================================== */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}

}

.hero-top{

  display:flex;justify-content:flex-end;
}
.hero-cap{text-align:right;color:var(--on-ink);max-width:22ch}

}

}

  position:relative;z-index:2;display:flex;align-items:center;gap:10px;

@keyframes cue{0%{transform:translateY(-100%)}60%,100%{transform:translateY(100%)}}

/* list view (work index) */

  display:grid;grid-template-columns:64px minmax(0,1fr);

/* ==========================================================================

.case-hero{padding-top:calc(var(--s6) + var(--s4))}
.case-title{font-size:clamp(2.2rem,6.4vw,5.4rem);font-weight:500;letter-spacing:-.035em;line-height:1.02;margin:var(--s3) 0 0;max-width:18ch}
.case-summary{margin:var(--s4) 0 0;max-width:44ch;font-size:clamp(1.05rem,1.8vw,1.45rem);line-height:1.5;color:var(--text-2)}
.case-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin-top:var(--s5);border-top:1px solid var(--line)}
@media(min-width:800px){.case-meta{grid-template-columns:repeat(4,1fr)}}
.case-meta div{padding:var(--s3) var(--s3) var(--s3) 0;border-bottom:1px solid var(--line)}
.case-meta dt{margin:0 0 7px;font-size:.6875rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--text-2)}
.case-meta dd{margin:0;font-size:1rem;font-weight:500;line-height:1.35}

.blocks{display:flex;flex-direction:column;gap:clamp(var(--s5),8vw,var(--s7))}
.media{position:relative;overflow:hidden;border-radius:var(--r-lg);background:var(--surface-2)}
.media img,.media video{width:100%;height:auto}
.ratio-16x9{aspect-ratio:16/9}
.ratio-4x5{aspect-ratio:4/5}
figcaption,.cap-line{margin-top:12px;font-size:.8125rem;color:var(--text-2)}
.blk-wide{max-width:1080px;margin-inline:auto}

.embed{position:relative;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;background:var(--ink)}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed-facade{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.embed-facade img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}
.play{
  position:relative;z-index:2;display:inline-flex;align-items:center;gap:11px;min-height:52px;
  padding:14px 24px;border-radius:var(--pill);background:var(--bg);color:var(--ink);
  font-size:.8125rem;font-weight:500;transition:background .3s var(--ease),color .3s var(--ease);
}
.embed-facade:hover .play{background:var(--accent);color:var(--ink)}

.blk-text{display:grid;grid-template-columns:1fr;gap:var(--s3)}
@media(min-width:900px){.blk-text{grid-template-columns:260px minmax(0,1fr);gap:var(--s5)}}
.blk-text h2{margin:0;font-size:1.35rem;font-weight:500;letter-spacing:-.02em}
.blk-text p{margin:0 0 1em;max-width:62ch;font-size:1.08rem;line-height:1.7}
.blk-text p:last-child{margin-bottom:0}

.blk-images{display:grid;gap:var(--s3);grid-template-columns:1fr}
@media(min-width:700px){.blk-images{grid-template-columns:repeat(2,1fr)}
  .blk-images.three{grid-template-columns:repeat(3,1fr)}}

.blk-quote blockquote{margin:0;max-width:22ch;font-size:clamp(1.7rem,4.2vw,3.2rem);font-weight:400;letter-spacing:-.03em;line-height:1.14}
.blk-quote cite{display:block;margin-top:var(--s3);font-style:normal;font-size:.8125rem;color:var(--text-2)}

.blk-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s4);padding:var(--s5) var(--s4);border-radius:var(--r-lg);background:var(--surface)}
@media(min-width:1000px){.blk-stats{grid-template-columns:repeat(4,1fr)}}
.stat b{display:block;font-size:clamp(2rem,4vw,3rem);font-weight:500;letter-spacing:-.04em;line-height:.95}
.stat span{display:block;margin-top:10px;font-size:.8125rem;color:var(--text-2)}

.credits{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media(min-width:700px){.credits{grid-template-columns:repeat(3,1fr)}}
.credit{padding:var(--s3) var(--s3) var(--s3) 0;border-bottom:1px solid var(--line)}
.credit dt{margin-bottom:6px;font-size:.6875rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--text-2)}
.credit dd{margin:0;font-size:1rem;font-weight:500}

.next{display:block;border-top:1px solid var(--line);padding-block:clamp(var(--s5),7vw,var(--s7));transition:color .4s var(--ease)}
.next:hover{color:var(--accent)}
.next .t{display:block;margin-top:var(--s2);font-size:clamp(1.8rem,6vw,4.4rem);font-weight:500;letter-spacing:-.035em;line-height:1.02}

/* ==========================================================================
   PORTFOLIO
   ========================================================================== */
.pf-roles{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s4)}
.pf-roles>span{font-size:.8125rem;font-weight:500;border:1px solid var(--line-2);border-radius:var(--pill);padding:9px 16px}
.deep{display:flex;flex-direction:column;gap:clamp(var(--s5),7vw,var(--s7))}
.deep-item{display:grid;grid-template-columns:1fr;gap:var(--s3)}
@media(min-width:900px){.deep-item{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s5);align-items:center}
  .deep-item:nth-child(even) .deep-media{order:2}}
.deep-media{aspect-ratio:4/3;border-radius:var(--r-lg);overflow:hidden;background:var(--surface-2)}
.deep-media>*{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.deep-media:hover>*{transform:scale(1.03)}
.deep-body h3{margin:10px 0 0;font-size:clamp(1.5rem,3vw,2.3rem);font-weight:500;letter-spacing:-.03em;line-height:1.06}
.deep-body p{margin:var(--s2) 0 0;color:var(--text-2);font-size:1.02rem;line-height:1.65;max-width:46ch}

.tools{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media(min-width:600px){.tools{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.tools{grid-template-columns:repeat(4,1fr)}}
.tool{padding:var(--s3) var(--s3) var(--s3) 0;border-bottom:1px solid var(--line)}
.tool h4{margin:0 0 8px;font-size:.6875rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--accent-2)}
.tool p{margin:0;font-size:.95rem;line-height:1.55;color:var(--text-2)}

.empty{padding:var(--s6) 0;text-align:center;color:var(--text-2)}
[hidden]{display:none !important}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .rv{opacity:1;transform:none}
}


/* ==========================================================================
   ENQUIRY DIALOG
   A mailto: loses most people at the point their mail client opens, so the
   button opens a form instead. Native <dialog> for focus handling and Esc.
   ========================================================================== */
.sheet-dlg{
  border:0;padding:0;background:transparent;max-width:min(560px,92vw);width:100%;
  color:var(--text);
}
.sheet-dlg::backdrop{background:rgba(11,13,20,.55);backdrop-filter:blur(6px)}
.sheet-dlg .enq,.sheet-dlg .enq-done{
  position:relative;background:var(--surface);border-radius:var(--r-lg);
  padding:clamp(26px,4vw,44px);box-shadow:0 30px 80px rgba(11,13,20,.24);
}
.sheet-dlg h2{
  margin:10px 0 0;font-size:clamp(1.5rem,3vw,2.1rem);font-weight:500;
  letter-spacing:-.03em;line-height:1.1;max-width:18ch;
}
.enq-note{margin:12px 0 var(--s4);color:var(--text-2);font-size:.95rem;line-height:1.55;max-width:44ch}
.enq-x{
  position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--text-2);
  transition:background .25s,color .25s;
}
.enq-x:hover{background:var(--bg);color:var(--text)}
.enq-f{margin-bottom:16px}
.enq-f label{
  display:block;margin-bottom:7px;font-size:.6875rem;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;color:var(--text-2);
}
.enq-f input,.enq-f textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  color:var(--text);padding:12px 14px;font:inherit;font-size:1rem;resize:vertical;
}
.enq-f input:focus,.enq-f textarea:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:transparent}
.enq-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.enq-err{min-height:22px;color:var(--accent-2);font-size:.875rem;line-height:1.4}
.enq-act{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:6px}
.enq-alt{font-size:.8125rem;color:var(--text-2);border-bottom:1px solid var(--line-2);padding-bottom:1px}
.enq-alt:hover{color:var(--text)}
.enq-send:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<a class="skip" href="#list">Skip to list</a>
<div id="shell-nav"></div>

<main>
  <section class="case-hero">
    <div class="wrap">
      <div class="lab">Index &mdash; all work</div>
      <h1 class="case-title">Work</h1>
      <div class="filter-set">
        <div class="filter-row">
          <span class="lab filter-lab">Sector</span>
          <div class="filters" id="sectors" role="group" aria-label="Filter by sector"></div>
        </div>
        <div class="filter-row">
          <span class="lab filter-lab">Discipline</span>
          <div class="filters" id="filters" role="group" aria-label="Filter by discipline"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding-block:var(--s3)">
        <span class="lab" id="count"></span>
        <button class="chip" id="clear" hidden>Clear filters</button>
        <button class="chip" id="view" aria-pressed="false" style="margin-left:auto">List view</button>
      </div>
    </div>
  </section>

  <section class="sec-tight" id="list" style="padding-top:var(--s3)">
    <div class="wrap">
      <div class="bento" id="cards"></div>
      <div class="rows" id="rows" hidden></div>
      <p class="empty" id="empty" hidden>No projects in that discipline.</p>
    </div>
  </section>

  <section id="contact" style="border-top:1px solid var(--line)">
    <div class="wrap">
      <button class="cta-link" data-contact>Start a project</button>
      <div class="cta-foot">
        <a class="pill pill-solid" data-mail data-mailto href="#"></a>
        <span class="lab" data-locations></span>
      </div>
    </div>
  </section>
</main>

<div id="shell-foot"></div>
<script>/* =============================================================================
   WNH — shared site runtime
   No framework, no build step. Loaded by every page.
   ============================================================================= */
(function (global) {
  'use strict';

  var W = {};

  /* ---------------------------------------------------------------- base
     The site has to work both at a domain root (wnhdesign.io/) and under a
     repo subpath (user.github.io/wnh/). Root-absolute paths break the second
     case, so the base is derived from this script's own URL instead. */
  var BASE = (function () {
    var s = document.currentScript;
    if (!s) { var all = document.getElementsByTagName('script'); s = all[all.length - 1]; }
    var src = (s && s.src) || '';
    var i = src.indexOf('assets/js/site.js');
    if (i > -1) return src.slice(0, i);
    return location.pathname.replace(/[^/]*$/, '');
  })();
  W.base = BASE;
  W.url = function (p) { return BASE + String(p == null ? '' : p).replace(/^\//, ''); };

  /* ------------------------------------------------------------- helpers */
  W.$  = function (s, r) { return (r || document).querySelector(s); };
  W.$$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  W.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };
  /* One typeface with a normal ampersand, so no glyph substitution. Kept as a
     named helper because every template calls it. */
  W.t = function (s) { return W.esc(s); };

  W.pad = function (n) { return String(n).padStart(2, '0'); };
  W.slugify = function (s) {
    return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  };

  /* the mark, inline so it inherits currentColor and costs no extra request */
  W.MARK = '<svg viewBox="0 0 193.99 86.03" role="img" aria-label="WNH" fill="currentColor">' +
    '<polygon points="133.06 12.67 133.06 73.36 117.97 76.35 117.97 67.5 93.49 43.01 93.49 21.69 117.97 46.17 117.97 9.68 133.06 12.67"/>' +
    '<polygon points="90.34 9.68 90.34 76.36 66.39 69.7 66.39 61.27 75.25 61.27 75.25 13.84 90.34 9.68"/>' +
    '<polygon points="63.24 17.02 63.24 68.82 39.3 62.16 39.3 61.27 48.15 61.27 48.15 21.21 63.24 17.02"/>' +
    '<polygon points="36.14 24.55 36.14 61.28 21.05 57.08 21.05 28.75 36.14 24.55"/>' +
    '<polygon points="172.94 20.58 172.94 65.26 170.5 65.94 170.48 65.95 157.86 68.45 157.86 50.56 136.22 50.56 136.22 35.47 157.86 35.47 157.86 17.58 172.94 20.58"/>' +
    '</svg>';

  var ARROW = '<svg width="13" height="10" viewBox="0 0 14 10" fill="none" aria-hidden="true">' +
    '<path d="M9 1l4 4-4 4M13 5H0" stroke="currentColor" stroke-width="1.3"/></svg>';

  /* --------------------------------------------------------- cloudinary */
  var WIDTHS = [640, 960, 1440, 1920, 2560];
  W.cloud = '';

  W.cld = {
    ok: function (id) { return !!(id && String(id).trim() && W.cloud); },
    img: function (id, w) {
      return 'https://res.cloudinary.com/' + W.cloud +
             '/image/upload/f_auto,q_auto,c_limit,w_' + (w || 1440) + '/' + id;
    },
    srcset: function (id) {
      return WIDTHS.map(function (w) { return W.cld.img(id, w) + ' ' + w + 'w'; }).join(', ');
    },
    video: function (id) {
      return 'https://res.cloudinary.com/' + W.cloud + '/video/upload/f_auto,q_auto,vc_auto/' + id + '.mp4';
    },
    poster: function (id) {
      return 'https://res.cloudinary.com/' + W.cloud + '/video/upload/so_1,f_auto,q_auto,w_1600/' + id + '.jpg';
    }
  };

  /* -------------------------------------------------------------- vimeo */
  W.vimeoId = function (url) {
    var m = String(url || '').match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([0-9a-z]+))?/i);
    return m ? { id: m[1], hash: m[2] || '' } : null;
  };
  W.vimeoSrc = function (url, autoplay) {
    var v = W.vimeoId(url);
    if (!v) return '';
    return 'https://player.vimeo.com/video/' + v.id + (v.hash ? '?h=' + v.hash + '&' : '?') +
           'title=0&byline=0&portrait=0&dnt=1&autopause=0' + (autoplay ? '&autoplay=1' : '');
  };

  /* a looping brand animation: no chrome, no sound, no controls */
  W.vimeoBg = function (url) {
    var v = W.vimeoId(url);
    if (!v) return '';
    return 'https://player.vimeo.com/video/' + v.id + (v.hash ? '?h=' + v.hash + '&' : '?') +
           'background=1&autoplay=1&loop=1&muted=1&autopause=0&dnt=1';
  };

  /* a file path, a Cloudinary public id, or a Vimeo URL — decided by shape */
  W.loopSrc = function (src) {
    src = String(src || '').trim();
    if (!src) return null;
    if (/vimeo\.com/i.test(src)) return { kind: 'vimeo', url: src };
    if (/^https?:\/\//i.test(src) || /\.(mp4|webm|mov|m4v)$/i.test(src)) {
      return { kind: 'file', url: /^https?:\/\//i.test(src) ? src : W.url(src) };
    }
    return W.cld.ok(src) ? { kind: 'file', url: W.cld.video(src), poster: W.cld.poster(src) } : null;
  };

  /* mount a loop into a box. the static mark holds the space from the first
     paint, so nothing is ever blank; the motion fades in once it can play.
     under reduced motion nothing starts on its own — the visitor presses play. */
  W.loop = function (box, conf, title) {
    if (!box) return false;
    if (typeof conf === 'string') conf = { src: conf };
    conf = conf || {};
    var src = W.loopSrc(conf.src || conf.vimeo);
    if (!src) return false;

    box.classList.add('is-loop');
    box.innerHTML = '';

    /* the holding frame takes the film's own ground colour, so the panel never
       flashes paper-white before a dark loop arrives */
    if (conf.bg) {
      box.style.setProperty('--loop-bg', conf.bg);
      var hex = String(conf.bg).replace('#', '');
      if (hex.length === 3) hex = hex.replace(/./g, '$&$&');
      if (/^[0-9a-f]{6}$/i.test(hex)) {
        var n = parseInt(hex, 16);
        var lum = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
        if (lum < 0.5) box.classList.add('is-dark');
      }
    }

    var still = document.createElement('div');
    still.className = 'loop-still';
    still.innerHTML = conf.poster
      ? '<img alt="" src="' + W.esc(W.cld.ok(conf.poster) ? W.cld.img(conf.poster, 720) : W.url(conf.poster)) + '">'
      : W.MARK;
    box.appendChild(still);

    var ready = function () { box.classList.add('is-ready'); };

    if (src.kind === 'file') {
      var v = document.createElement('video');
      v.className = 'loop-media';
      v.src = src.url;
      if (src.poster) v.poster = src.poster;
      v.muted = true; v.loop = true; v.playsInline = true;
      v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
      v.setAttribute('aria-hidden', 'true');
      v.preload = W.reduce ? 'metadata' : 'auto';
      /* nothing autoplays under reduced motion: hand over the real controls,
         and drop the still so it cannot sit on top of them */
      if (W.reduce) { v.controls = true; still.remove(); ready(); }
      else { v.autoplay = true; v.addEventListener('playing', ready, { once: true });
             v.addEventListener('loadeddata', ready, { once: true }); }
      v.addEventListener('error', function () { box.classList.remove('is-ready'); });
      box.appendChild(v);
      return true;
    }

    /* Vimeo: a player is ~300KB of chrome before the first frame, so the mark
       stays put until the embed reports it has loaded */
    var mount = function (autoplay) {
      var f = document.createElement('iframe');
      f.className = 'loop-media';
      f.title = title || 'Motion';
      f.setAttribute('frameborder', '0');
      f.allow = 'autoplay; fullscreen; picture-in-picture';
      f.addEventListener('load', function () { setTimeout(ready, 400); });
      if (autoplay) {
        f.src = W.vimeoBg(src.url);
        f.setAttribute('tabindex', '-1');
        f.setAttribute('aria-hidden', 'true');
      } else {
        f.src = W.vimeoSrc(src.url, true);
      }
      return f;
    };

    if (W.reduce) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'loop-play';
      b.innerHTML = '<span class="play" aria-hidden="true">&#9654;</span>';
      b.setAttribute('aria-label', 'Play ' + (title || 'motion'));
      b.addEventListener('click', function () { box.innerHTML = ''; box.appendChild(mount(false)); ready(); });
      still.appendChild(b);
    } else {
      box.appendChild(mount(true));
    }
    return true;
  };

  /* -------------------------------------------------------------- media */
  W.cover = function (p, i, w) {
    var c = p.cover || {};
    if (W.cld.ok(c.src)) {
      return '<img src="' + W.cld.img(c.src, w || 960) + '" srcset="' + W.cld.srcset(c.src) +
             '" sizes="(max-width:760px) 92vw, (max-width:1180px) 46vw, 34vw" alt="' +
             W.esc(c.alt || p.title) + '" loading="lazy" decoding="async">';
    }
    return '<div class="ph" data-tone="' + W.esc(p.tone || 'wine') + '">' +
           '<span class="num">' + W.pad((i || 0) + 1) + '</span></div>';
  };

  /* Bento spans on a six-column grid. The pattern has period six and each row
     sums to six, so it tiles cleanly — and the last card is widened to fill
     whatever is left of its row, so an odd project count never ends on a hole. */
  var SPAN_PATTERN = ['wide', '', 'half', 'half', 'wide', ''];
  var SPAN_W = { '': 2, half: 3, wide: 4, full: 6 };

  W.spans = function (n) {
    var out = [], row = 0;
    for (var i = 0; i < n; i++) {
      var s = SPAN_PATTERN[i % SPAN_PATTERN.length];
      if (row + SPAN_W[s] > 6) row = 0;
      out.push(s);
      row = (row + SPAN_W[s]) % 6;
    }
    if (n && row > 0) {
      var need = SPAN_W[out[n - 1]] + (6 - row);
      out[n - 1] = need >= 6 ? 'full' : need >= 4 ? 'wide' : need === 3 ? 'half' : '';
    }
    return out;
  };

  W.tags = function (list, onInk) {
    return '<span class="tags">' + (list || []).map(function (x) {
      return '<span class="tag' + (onInk ? ' tag-ink' : '') + '">' + W.esc(x) + '</span>';
    }).join('') + '</span>';

led a chainsaw and drawn a logistics icon set. What links them isn't the craft — it's that in every case somebody had to keep it going after I left. Building the thing that lets them is the part of the job I actually love."}, "contact": {"endpoint": "", "note": "A sentence is enough to start. I reply within two working days."}}, "capabilities": [{"id": "identity", "title": "Brand Identity Systems", "summary": "Marks, construction and clear-space rules, colour and type specs, custom icon sets, stationery — documented so anyone can apply them.", "items": ["Logo & lockups", "Construction & clear space", "Colour & type systems", "Icon sets", "Stationery", "Guidelines"]}, {"id": "campaign", "title": "Campaign & Event Identity", "summary": "One key visual carried the whole way out — stage backdrop, banners, digital panels, print, invitations, trophies.", "items": ["Key visual", "Stage & backdrop", "Banners & digital panels", "Brochures & invitations", "Awards & trophies"]}, {"id": "exhibition", "title": "Exhibition & Spatial", "summary": "Museum-grade exhibitions, roadshow booths and showcase builds, previsualised in 3D before anyone cuts timber.", "items": ["Exhibition design", "Roadshow booths", "Wall graphics & vitrines", "3D previsualisation", "Fabrication drawings"]}, {"id": "motion", "title": "3D & Motion", "summary": "Product and game 3D, look development, animated idents and kinetic titles — modelled, lit and rendered start to finish.", "items": ["3D modelling & rendering", "Product & game visuals", "Idents & titles", "Look development", "Motion graphics"]}, {"id": "film", "title": "Film & Broadcast", "summary": "Documentary series, corporate interviews and live multi-camera events, from treatment through to grade.", "items": ["Documentary & brand film", "Interviews", "Live & multi-camera", "Edit & grade", "Event coverage"]}, {"id": "digital", "title": "Digital & Tooling", "summary": "Sites, content platforms and the internal tools that let a team produce on-brand work without a designer in the room.", "items": ["Responsive sites", "Content platforms", "Internal tools", "Design systems", "Handover & training"]}], "process": [{"step": "01", "title": "Brief", "body": "One call, then a written brief you approve. If the brief is wrong, everything after it is decoration."}, {"step": "02", "title": "Direction", "body": "Two routes, not ten. Each with a reason it exists and a reason to kill it."}, {"step": "03", "title": "Production", "body": "Shoot, build, animate. Weekly cuts, no surprises at the end."}, {"step": "04", "title": "Handover", "body": "Master files, source files, and a system your team can run without us."}], "tools": [{"id": "design", "title": "Design", "body": "Illustrator, Photoshop, InDesign, Figma"}, {"id": "three", "title": "3D", "body": "Cinema 4D, Blender, Redshift, Octane"}, {"id": "motion", "title": "Motion & Film", "body": "After Effects, Premiere, DaVinci Resolve"}, {"id": "build", "title": "Build", "body": "HTML, CSS, JavaScript, WordPress, Apps Script, Cloudflare"}], "clients": ["Milwaukee", "TTI", "Hong Kong Sanatorium & Hospital", "HKMA", "Vita Green 維特健靈", "BananaUnder 蕉下", "Benoy", "CAREARCH HK", "和田保健貼", "S.K.H. St. Christopher's Home", "Cellmax", "Acker Merrall & Condit", "Compass Offices", "Jann Global Logistics", "Sing Ping Cantonese Opera", "Irish Chaplaincy"], "projects": [{"slug": "milwaukee-breakthrough", "title": "Asia Breakthrough Growth", "client": "Milwaukee — TTI", "year": 2022, "disciplines": ["Live Broadcast", "Motion", "Event"], "role": "Live Stream Technical Lead, Motion Graphics", "featured": true, "deep": true, "tone": "milwaukee", "summary": "Milwaukee's largest Asia event of 2022, staged as a live broadcast — the multi-camera gallery, the motion graphics package, and the whole technical chain from camera to stream.", "cover": {"src": "", "alt": "Milwaukee Asia Breakthrough Growth live broadcast"}, "credits": [{"role": "Live Stream Technical Lead", "name": "WNH"}, {"role": "Motion Graphics", "name": "WNH"}, {"role": "Client", "name": "Milwaukee"}], "blocks": [{"type": "text", "heading": "The brief", "body": "Asia Breakthrough Growth was Milwaukee's largest regional event of 2022, and it was built to be watched live rather than reported afterwards. That decision changes everything upstream: there is no edit to fix a mistake in, and no second pass at a graphic that missed its cue.\n\nTwo roles on the same show — technical lead on the live stream, and designer of the motion graphics package running through it."}, {"type": "image", "src": "", "alt": "Broadcast gallery during Asia Breakthrough Growth", "caption": "Multi-camera gallery, live to region", "size": "full"}, {"type": "text", "heading": "One take, no post", "body": "A broadcast graphics package is not a video. It has to be built as a set of states that can be called on cue, hold at any length, and survive being cut to from a camera that arrived a beat early.\n\nThe technical chain — cameras, switching, encoding, stream — had to hold for the full run of the show, in a room full of people who could not be asked to wait."}, {"type": "images", "items": [{"src": "", "alt": "Stage and product reveal"}, {"src": "", "alt": "Presenter to camera"}, {"src": "", "alt": "Floor team before broadcast"}], "caption": "Product reveal, presenter position, floor team"}, {"type": "text", "heading": "Owning both ends", "body": "Designing the graphics and running the stream is usually two people in two rooms. Doing both meant the package was designed around what the switcher could actually do, and the show was cut around what the graphics needed.\n\nOn a live show that is the difference between a graphic that lands and a graphic that arrives late."}, {"type": "vimeo", "url": "", "caption": "Asia Breakthrough Growth — broadcast package"}], "sector": "Consumer & Retail"}, {"slug": "hksh-centenary", "title": "A Century of Clinical Excellence", "client": "Hong Kong Sanatorium & Hospital", "year": 2022, "disciplines": ["Brand", "Exhibition", "3D", "Live Broadcast"], "role": "Design, 3D & Exhibition, Broadcast Technical", "deep": true, "tone": "hksh", "summary": "The centenary programme for Hong Kong Sanatorium & Hospital — commemorative design, an exhibition taken from 3D model to finished build, and the technical side of the opening ceremony's online broadcast.", "credits": [{"role": "Commemorative design", "name": "WNH"}, {"role": "Exhibition — 3D to build", "name": "WNH"}, {"role": "Opening ceremony — broadcast technical", "name": "WNH"}, {"role": "Client", "name": "Hong Kong Sanatorium & Hospital"}], "blocks": [{"type": "text", "heading": "A hundred years is not a logo", "body": "Hong Kong Sanatorium & Hospital turned a hundred in 2022. A centenary of that size lands as a ceremony, an exhibition, a film series and several hundred commemorative pieces — and all of it has to read as one year rather than six separate jobs.\n\n醫護傳承 · 卓越百年 — A Century of Clinical Excellence."}, {"type": "image", "src": "", "alt": "Centenary opening ceremony with the 3D 100 mark", "caption": "The opening ceremony", "size": "full"}, {"type": "text", "heading": "Designed it, then ran the broadcast of it", "body": "Alongside the commemorative design, the technical side of the opening ceremony's online broadcast was mine — which meant the same person who designed what was on the stage was responsible for how it reached everyone who could not be in the room.\n\nThat is an unusual pairing, and a useful one. Ceremony graphics get designed for the room and then fall apart on a stream; here they were built knowing exactly what the stream would do to them."}, {"type": "text", "heading": "The mark had to be an object first", "body": "The centenary mark was modelled in 3D before it was drawn flat, because it had to exist as a physical sculpture on the ceremony stage. Designing it as an object first meant the printed version inherited the real thing's proportions, rather than the sculpture being a thickened copy of a logo."}, {"type": "images", "items": [{"src": "", "alt": "Centenary mark, front view"}, {"src": "", "alt": "Centenary mark, side view"}, {"src": "", "alt": "Stage sculpture in place"}], "caption": "Front, side, and as built"}, {"type": "text", "heading": "From three-dimensional model to finished build", "body": "The centenary exhibition set out a hundred years of the hospital's part in medical advances in Hong Kong — healthcare delivery, medical education and clinical research, and how the institution held its standard of care through each of them.\n\nThe framework was built from 3D models through to the finished thing on the floor. Exhibition work is unforgiving in a way print is not: a wrong measurement is not a reprint, it is a carpenter."}, {"type": "images", "items": [{"src": "", "alt": "Exhibition framework in 3D"}, {"src": "", "alt": "Wall graphics and archive vitrines"}, {"src": "", "alt": "Uniform display and showcase items"}], "caption": "3D framework, wall graphics, showcase"}, {"type": "text", "heading": "Filmed where the work happens", "body": "A film series shot inside working theatres, labs and consultation rooms rather than on a set. Hospitals are difficult places to film in and impossible to fake, which is the reason to do it."}, {"type": "vimeo", "url": "", "caption": "A Century of Clinical Excellence — film series"}], "cover": {"src": "", "alt": "A Century of Clinical Excellence"}, "featured": true, "sector": "Health & Care"}, {"slug": "hkma-60", "title": "Sixty Years of Management", "client": "HKMA", "year": 2020, "disciplines": ["Brand", "Digital", "Film"], "role": "Identity, Web, Film", "deep": true, "tone": "hkma", "summary": "A 60th-anniversary identity for the Hong Kong Management Association, extended into an interview platform carrying over a hundred leadership insights from Hong Kong business leaders.", "blocks": [{"type": "text", "heading": "An anniversary that had to do work", "body": "The Hong Kong Management Association turned sixty. The mark was built on a construction grid with clear-space and colour rules from the start, because it was going to spend a year being applied by people who are not designers — event teams, printers, partner organisations."}, {"type": "image", "src": "", "alt": "HKMA 60 mark with construction grid and clear space", "caption": "Construction, clear space, colour", "size": "full"}, {"type": "text", "heading": "From a mark to a platform", "body": "The anniversary then became content. Over a hundred filmed interviews with Hong Kong business leaders, indexed and browsable by field — a body of leadership insight rather than a commemorative page.\n\nDesigning the identity and building the platform in the same hands meant the site was laid out around what the interviews actually were, not around a template."}, {"type": "images", "items": [{"src": "", "alt": "Leaders index"}, {"src": "", "alt": "Interview page"}, {"src": "", "alt": "Field selection"}], "caption": "The interview platform"}, {"type": "vimeo", "url": "", "caption": "HKMA 60 — interview series"}], "cover": {"src": "", "alt": "Sixty Years of Management"}, "credits": [{"role": "Design & Direction", "name": "WNH"}], "featured": true, "sector": "Corporate & Institutional"}, {"slug": "carearch", "title": "A Mark Built From People", "client": "CAREARCH HK 善延護理", "year": 2023, "disciplines": ["Brand", "Digital"], "role": "Identity System, Web Design", "featured": true, "deep": true, "tone": "hksh", "summary": "A full identity for a Hong Kong nursing agency — a mark drawn from human figures arranged into a care cross, documented with construction, type and colour rules, and applied from ID badge to bilingual website.", "cover": {"src": "", "alt": "CAREARCH HK identity system"}, "credits": [{"role": "Identity & Web", "name": "WNH"}, {"role": "Client", "name": "CAREARCH HK 善延護理有限公司"}], "blocks": [{"type": "text", "heading": "The mark is the service", "body": "A nursing agency places people. So the mark is made of people — figures arranged into the plus of a care symbol, each one a different colour because the whole point is that they are individuals being matched to a family.\n\nIt reads as a medical cross at a glance and as a group of people the moment you look properly."}, {"type": "image", "src": "", "alt": "Primary logo and construction grid", "caption": "Primary logo, and the grid it is built on", "size": "full"}, {"type": "text", "heading": "Documented so it survives", "body": "Construction and clear space on a grid. DFYuanHK for the Chinese, tracked +100; Gotham Bold for the Latin, tracked +10. A five-colour system. Three icon treatments and four secondary lockups, so there is a correct answer for a badge, a favicon, an English-only context and a stacked one.\n\nThis is the part clients skip and then quietly regret. An agency's brand gets applied by nurses, coordinators and printers — never by the designer."}, {"type": "images", "items": [{"src": "", "alt": "Type specification"}, {"src": "", "alt": "Colour system"}, {"src": "", "alt": "Icon and secondary lockups"}], "caption": "Type, colour, and the secondary set"}, {"type": "text", "heading": "Down to the lanyard", "body": "Business cards, the staff ID badge on its lanyard, and a bilingual site built around the one thing a family actually arrives to do: search for care by district and service type.\n\n培育醫護專業 · 傳承愛心使命."}, {"type": "images", "items": [{"src": "", "alt": "Business cards"}, {"src": "", "alt": "Staff ID badge and lanyard"}, {"src": "", "alt": "Desktop and mobile site"}], "caption": "Applications"}], "sector": "Health & Care"}, {"slug": "milwaukee-house-builder", "title": "House Builder", "client": "Milwaukee — TTI", "year": 2023, "disciplines": ["3D", "Motion", "Game"], "role": "3D Modelling, Game Visual Design, Motion", "deep": false, "tone": "milwaukee", "summary": "A 3D-built promotional game world for Milwaukee — modelled tools, wood and plank textures, level art and the UI that carries the brand into a game without diluting it.", "blocks": [{"type": "text", "heading": "A power-tool brand, in a game", "body": "House Builder puts Milwaukee's tools in a player's hands to build houses. A tool brand in a game only survives if the tools read as the real product — the moment a chainsaw becomes a generic game asset, the whole thing stops being Milwaukee and becomes an advert for nobody."}, {"type": "image", "src": "", "alt": "House Builder key visual with tools and timber house", "caption": "Key visual", "size": "full"}, {"type": "text", "heading": "Every texture is a product decision", "body": "Levels are named after timber — spruce, oak, redwood, kauri — and each has its own plank and grain treatment, because the difference between woods is the difference between which tool you reach for.\n\nThe tool cards carry the real M18 line-up. The action set — fastening, cutting, cleaning — maps to product categories rather than game verbs."}, {"type": "images", "items": [{"src": "", "alt": "Timber and plank texture study"}, {"src": "", "alt": "In-game tool selection UI"}, {"src": "", "alt": "Level progression screens"}], "caption": "Texture study, tool UI, level progression"}, {"type": "text", "heading": "Modelled, lit, rendered, animated", "body": "3D modelling, game visual design, motion graphics and rendering, all in one pipeline — which is what let the marketing renders and the in-game art stay the same object rather than two interpretations of it."}, {"type": "vimeo", "url": "", "caption": "House Builder — 3D animation"}], "cover": {"src": "", "alt": "House Builder"}, "credits": [{"role": "Design & Direction", "name": "WNH"}], "featured": true, "sector": "Consumer & Retail"}, {"slug": "bananaunder", "title": "Pocket, Capsule, Mini", "client": "BananaUnder", "year": 2021, "disciplines": ["3D", "Product", "Campaign"], "role": "3D Product Visualisation", "featured": false, "deep": false, "tone": "cellmax", "summary": "3D product key visuals for the sun-protection brand's umbrella lines — 口袋系列, 膠囊系列 and 小黑傘系列 — each series given its own colour world while staying one family.", "cover": {"src": "", "alt": "BananaUnder umbrella series key visual"}, "credits": [{"role": "3D & Art Direction", "name": "WNH"}, {"role": "Client", "name": "BananaUnder 蕉下"}], "blocks": [{"type": "text", "heading": "One product, three arguments", "body": "Three umbrella series, each sold on a different claim — pocket-sized and ultralight, capsule in a range of colours, the mini black umbrella blocking 99% of UV. The same object photographed three ways would have made them look like the same thing.\n\nBuilt in 3D instead: each series gets its own colour world, light and set of floating forms, so a shopper can tell the lines apart at a glance while the brand still reads as one."}, {"type": "images", "items": [{"src": "", "alt": "口袋系列 — pocket series"}, {"src": "", "alt": "膠囊系列 CAPSULE 4.0"}, {"src": "", "alt": "小黑傘系列 — mini black umbrella"}], "caption": "Three series, three colour worlds"}, {"type": "text", "heading": "Why render rather than shoot", "body": "A studio shoot fixes you to the samples that exist on the day. Rendering means the whole range can be shown in every colourway, at a consistent light and scale, before the range is even finished."}, {"type": "image", "src": "", "alt": "Product key visual detail", "caption": "Rendered, not shot", "size": "full"}], "sector": "Consumer & Retail"}, {"slug": "vita-green", "title": "Vita Calm", "client": "Vita Green 維特健靈", "year": 2025, "disciplines": ["Campaign", "Retail", "Digital"], "role": "Key Visual, Campaign Design", "featured": true, "deep": false, "tone": "hkma", "summary": "Campaign and e-commerce visuals for Hong Kong's number-one sleep supplement — a night world that carries a hard retail offer without turning into a discount banner.", "cover": {"src": "", "alt": "Vita Green Vita Calm campaign key visual"}, "credits": [{"role": "Design", "name": "WNH"}, {"role": "Client", "name": "Vita Green 維特健靈"}], "blocks": [{"type": "text", "heading": "A premium claim and a hard offer, in one frame", "body": "寧心 is a four-year category leader with a gift-with-purchase mechanic attached — buy nine boxes and a smartwatch comes with it. Those two jobs pull in opposite directions: the first wants calm and authority, the second wants urgency.\n\nThe answer is a night sky rather than a sale colour. Deep navy and gold hold the No.1 claim; the offer sits inside the same world as gold-edged badges instead of being pasted on top of it."}, {"type": "image", "src": "", "alt": "Vita Calm campaign banner", "caption": "The banner, at full retail width", "size": "full"}, {"type": "text", "heading": "Ingredients as evidence", "body": "GABA, L-theanine, and the herbs — 靈芝, 柴胡, 酸棗仁, 當歸丹參 — floated as lit spheres beside the pack. In Hong Kong health retail the ingredient list is the argument, so it gets treated as imagery rather than as small print."}], "sector": "Health & Care"}, {"slug": "dsa-52", "title": "Pride in Perseverance", "client": "HKMA", "year": 2021, "disciplines": ["Brand", "Campaign", "Print"], "role": "Key Visual, Campaign Design", "tone": "wine", "summary": "Campaign identity for the 52nd Distinguished Salesperson Award — one crystalline key visual carried through stage backdrop, digital panels, banners, brochures, invitations and the award itself.", "blocks": [{"type": "text", "heading": "功在不捨，傲而不凡", "body": "Campaign identity for the 52nd Distinguished Salesperson Award — Pride in Perseverance. An awards programme is a stress test for a key visual: it has to hold at the scale of a stage backdrop and at the size of a medal ribbon, in two languages, on the same day."}, {"type": "image", "src": "", "alt": "DSA 52 key visual", "caption": "The key visual", "size": "full"}, {"type": "text", "heading": "One visual, every surface", "body": "Stage backdrop, digital panels, roll-up banners, the winners' brochure, invitations, and the award itself. Each one is a different production process with a different tolerance, so the visual was built from elements that could be separated and re-weighted rather than a single fixed composition."}, {"type": "images", "items": [{"src": "", "alt": "Stage backdrop and digital panels"}, {"src": "", "alt": "Winners' brochure spread"}, {"src": "", "alt": "Award ribbon and medal"}], "caption": "Backdrop, brochure, award"}], "cover": {"src": "", "alt": "Pride in Perseverance"}, "credits": [{"role": "Design & Direction", "name": "WNH"}], "featured": false, "deep": false, "sector": "Corporate & Institutional"}, {"slug": "benoy-love-work", "title": "Love Work", "client": "Benoy", "year": 2021, "disciplines": ["Motion", "Film", "Presentation"], "role": "Motion Graphics, Film, Internal Comms", "featured": false, "deep": false, "tone": "compass", "summary": "An ongoing engagement with the architecture practice — the APAC monthly report as motion graphics, an animated argument for working from any location, project films for client presentations, and internal award banners.", "cover": {"src": "", "alt": "Benoy motion graphics and film"}, "credits": [{"role": "Motion & Film", "name": "WNH"}, {"role": "Client", "name": "Benoy"}], "blocks": [{"type": "text", "heading": "First Friday", "body": "The APAC marketing group presents a monthly report. Turning it into motion graphics was the first piece of motion work for Benoy — a recurring format rather than a one-off film, which means it has to be quick to rebuild every month and still look deliberate."}, {"type": "image", "src": "", "alt": "First Friday title sequence", "caption": "First Friday — monthly report titles", "size": "full"}, {"type": "text", "heading": "Love Work", "body": "Benoy put forward a position on the post-COVID work environment: that work happens from any location. It needed a presentation and an animated video to argue it.\n\nThe animation had to carry an argument rather than decorate one — isometric diagrams that show what actually changes when an office stops being a single address."}, {"type": "images", "items": [{"src": "", "alt": "Post-COVID workplace diagram"}, {"src": "", "alt": "Working from any location"}], "caption": "The Love Work argument, drawn"}, {"type": "text", "heading": "Project films and award banners", "body": "Films for a run of architectural projects, cut for presenting to clients. And internal banners announcing the projects that had won architectural prizes — small work, but it is what a practice's own people see every day."}, {"type": "vimeo", "url": "", "caption": "Project film"}], "sector": "Corporate & Institutional"}, {"slug": "wada", "title": "A Dehumidifier You Wear", "client": "和田保健貼", "year": 2024, "disciplines": ["Campaign", "Retail", "3D"], "role": "Key Visual, Retail Design", "featured": false, "deep": false, "tone": "cellmax", "summary": "Retail campaign for a Japanese-made health patch — a celebrity endorsement, three benefit claims and two product variants, held together by one idea a shopper understands in a second.", "cover": {"src": "", "alt": "和田保健貼 retail poster"}, "credits": [{"role": "Design", "name": "WNH"}, {"role": "Client", "name": "和田保健貼"}], "blocks": [{"type": "text", "heading": "貼上身之抽濕機", "body": "A patch that draws damp out of the body is a hard thing to sell in a sentence. 貼上身之抽濕機 — a dehumidifier you stick on — does it in five characters, and the whole poster is built to deliver that line rather than to list features.\n\n告別水腫 · 回復幼腿 · 改善酸痛 arrive as soft bubbles around it, so the benefits support the idea instead of competing with it."}, {"type": "image", "src": "", "alt": "和田保健貼 retail poster", "caption": "The poster", "size": "full"}, {"type": "text", "heading": "Endorsement, accreditation, and two SKUs", "body": "Hong Kong health retail runs on trust markers: a celebrity user, an association accreditation, 日本製造. Each needs its own place in the hierarchy or they cancel each other out.\n\nThe two variants — 竹酢 and 唐辛子 — are shown as packs rather than as flat swatches, and the 3D foot and hand renders show where the thing actually goes. That last part matters more than it sounds: most shoppers have never used one."}], "sector": "Health & Care"}, {"slug": "cellmax", "title": "Fifteen Years", "client": "Cellmax", "year": 2023, "disciplines": ["Brand", "Print", "Social"], "role": "Design, Art Direction", "tone": "cellmax", "summary": "Anniversary identity and collateral for the skincare brand — retail display, leaflets, brochures and a social system that keeps the range looking like one family.", "blocks": [{"type": "text", "heading": "Fifteen years, one shelf", "body": "An anniversary mark for a skincare brand, extended across retail display, leaflets, brochures and social. Beauty collateral fails in a specific way: every product gets its own treatment until the range stops looking like one brand on the shelf."}, {"type": "image", "src": "", "alt": "Cellmax fifteenth anniversary key visual", "caption": "Anniversary key visual", "size": "full"}, {"type": "text", "heading": "A family, not a set of one-offs", "body": "The system fixes the proportions, the colour behaviour and the type relationship, so a new product or a new promotion joins the family instead of restarting it."}, {"type": "images", "items": [{"src": "", "alt": "Retail display"}, {"src": "", "alt": "Leaflet and brochure"}, {"src": "", "alt": "Social key visuals"}], "caption": "Display, print, social"}], "cover": {"src": "", "alt": "Fifteen Years"}, "credits": [{"role": "Design & Direction", "name": "WNH"}], "featured": false, "deep": false, "sector": "Health & Care"}, {"slug": "compass-web-tools", "title": "The Tool Suite", "client": "Compass Offices", "year": 2026, "disciplines": ["Digital", "Design Systems"], "role": "Design & Build", "featured": false, "deep": true, "tone": "compass", "summary": "A suite of hand-built, single-file web tools that let a marketing team across nine cities produce on-brand collateral without a designer in the room.", "cover": {"src": "", "alt": "Compass Offices web tool suite", "ratio": "16x9"}, "credits": [{"role": "Design & Build", "name": "WNH"}, {"role": "Client", "name": "Compass Offices"}], "blocks": [{"type": "text", "heading": "The problem", "body": "Nine cities, one brand, and a marketing team that needed a one-pager by Thursday. Every request routed through a designer, so every request waited — and the further from head office, the longer the wait and the looser the brand.\n\nThe fix was not a template library. Templates get edited until they are not templates."}, {"type": "image", "src": "", "alt": "One-Pager Builder interface", "caption": "Brand rules enforced by the tool, not by review", "size": "full"}, {"type": "text", "heading": "Make the brand the easy path", "body": "Each tool is a single self-contained HTML file. It holds the type, colour, spacing and logo rules, and it will not produce something off-brand because there is no control that lets it.\n\nA marketer fills in the content, the tool does the design. The output is on-brand because it could not have been anything else."}, {"type": "quote", "text": "The brand stops being a document people are asked to read, and becomes the shape of the tool they are already using.", "attribution": "The idea the suite runs on"}, {"type": "stats", "items": [{"value": "9", "label": "Cities served"}, {"value": "1 file", "label": "Per tool, no build step"}, {"value": "0", "label": "Design reviews needed"}]}], "sector": "Corporate & Institutional"}, {"slug": "st-christophers", "title": "Seventy Dollars a Month", "client": "S.K.H. St. Christopher's Home 聖公會聖基道兒童院", "year": 2025, "disciplines": ["Campaign", "Social", "Charity"], "role": "Campaign Design", "featured": false, "deep": false, "tone": "opera", "summary": "A child sponsorship campaign for the children's home's ninetieth year — 童愛傳承, and one number the reader has to be able to say yes to.", "cover": {"src": "", "alt": "小小助養人計劃 campaign"}, "credits": [{"role": "Design", "name": "WNH"}, {"role": "Client", "name": "S.K.H. St. Christopher's Home"}], "blocks": [{"type": "text", "heading": "The number does the asking", "body": "小小助養人計劃 — the Little Sponsor Programme. Charity work fails when the ask is buried under the mission statement. Here 每月70元 sits on its own card at the bottom of the frame, at a size nothing else competes with, so the reader reaches a decision rather than a feeling.\n\n童愛傳承 above it carries the ninetieth year — the argument that this is a thing being handed on, not launched."}, {"type": "image", "src": "", "alt": "小小助養人計劃 campaign visual", "caption": "The ask, and the year it sits in", "size": "full"}], "sector": "Culture & Non-profit"}, {"slug": "hksh-open-day", "title": "Open Day", "client": "Hong Kong Sanatorium & Hospital", "year": 2023, "disciplines": ["Exhibition", "Campaign", "Print"], "role": "Booth System, Graphics", "featured": false, "deep": false, "tone": "hksh", "summary": "A modular booth system for a hospital open day built around diabetes education — measuring stations, interactive panels and take-home print that a nursing team could set up and run without a designer present.", "cover": {"src": "", "alt": "HKSH open day booth system"}, "credits": [{"role": "Design", "name": "WNH"}, {"role": "Client", "name": "Hong Kong Sanatorium & Hospital"}], "blocks": [{"type": "text", "heading": "Health education has to be handled", "body": "健康你「圖」多少 — an open day where visitors check their own numbers. Blood sugar readings, a myth-busting game, a measuring wheel: the graphics are not there to be admired, they are there to be touched by strangers and explained by a nurse in thirty seconds."}, {"type": "images", "items": [{"src": "", "alt": "Measuring station"}, {"src": "", "alt": "Blood sugar panel"}, {"src": "", "alt": "Myth-busting game"}], "caption": "Stations across the floor"}, {"type": "text", "heading": "Built to be run by the ward, not the studio", "body": "The stands are modular and repeatable, so the same kit works in a lobby, a corridor or a hall, and the team running it can set it up themselves. Leaflets and take-home print carry the same system, so what a visitor leaves with matches what they just stood in front of."}, {"type": "image", "src": "", "alt": "Take-home leaflets and print", "caption": "What visitors take home", "size": "full"}], "sector": "Health & Care"}, {"slug": "jann-global", "title": "Jann Global Logistics", "client": "Jann Global Logistics", "year": 2019, "disciplines": ["Brand"], "role": "Identity System", "tone": "logistics", "summary": "A complete identity for a freight company — mark, typographic spec, a custom set of 3D logistics icons, colour system and full stationery.", "blocks": [{"type": "text", "heading": "A freight company that had to look like one", "body": "A complete identity for a logistics business — mark, typographic specification, colour system and full stationery, documented so it could be used without asking."}, {"type": "image", "src": "", "alt": "Jann Global Logistics identity", "caption": "The mark and colour system", "size": "full"}, {"type": "text", "heading": "Icons as part of the system", "body": "Logistics companies drown in stock icons that never match. This one got a custom set, modelled in 3D and lit consistently, so a diagram of a service reads as the same brand as the letterhead."}, {"type": "images", "items": [{"src": "", "alt": "Custom 3D logistics icon set"}, {"src": "", "alt": "Typographic specification"}, {"src": "", "alt": "Stationery"}], "caption": "Icons, type spec, stationery"}], "cover": {"src": "", "alt": "Jann Global Logistics"}, "credits": [{"role": "Design & Direction", "name": "WNH"}], "featured": false, "deep": false, "sector": "Corporate & Institutional"}, {"slug": "sing-ping-opera", "title": "Keeping the Songs", "client": "Sing Ping Cantonese Opera", "year": 2022, "disciplines": ["Brand", "Film", "Social"], "role": "Identity, Film, Content", "tone": "opera", "summary": "Bilingual identity and performance   W._unused = function () {

  /* --------------------------------------------------------------- menu */
  W.menu = function () {

    burger.addEventListener('click', function () { set(!document.body.classList.contains('menu')); });
    W.$$('#sheet a').forEach(function (a) { a.addEventListener('click', function () { set(false); }); });
    document.addEventListener('keydown', function (e) {

<script>
WNH.boot(function (d) {
  var W = WNH;
  var all = W.projects();
  var q = new URLSearchParams(location.search);
  var active = q.get('d') || '';
  var sector = q.get('s') || '';

  /* two filters that combine, so "Health & Care" + "Brand" is one question
     rather than two separate views of the same list */
  function chips(host, values, current, key) {
    W.$(host).innerHTML =
      ['<button class="chip" data-v="" aria-pressed="' + (!current) + '">All</button>']
      .concat(values.map(function (x) {
        return '<button class="chip" data-v="' + W.esc(x) + '" aria-pressed="' +
               (current === x) + '">' + W.esc(x) + '</button>';
      })).join('');
    W.$(host).addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      if (key === 's') sector = b.dataset.v; else active = b.dataset.v;
      W.$$(host + ' .chip').forEach(function (c) {
        c.setAttribute('aria-pressed', String(c.dataset.v === (key === 's' ? sector : active)));
      });
      var u = new URL(location);
      sector ? u.searchParams.set('s', sector) : u.searchParams.delete('s');
      active ? u.searchParams.set('d', active) : u.searchParams.delete('d');
      history.replaceState(null, '', u);
      draw();
    });
  }
  chips('#sectors', W.sectors(), sector, 's');

  W.$('#clear').addEventListener('click', function () {
    sector = ''; active = '';
    W.$$('.chip[data-v]').forEach(function (c) {
      c.setAttribute('aria-pressed', String(!c.dataset.v));
    });
    history.replaceState(null, '', location.pathname);
    draw();
  });

  function draw() {
    var list = all.filter(function (p) {
      return (!sector || p.sector === sector) &&
             (!active || (p.disciplines || []).indexOf(active) > -1);
    });
    var bits = [sector, active].filter(Boolean);
    W.$('#count').textContent = list.length + (list.length === 1 ? ' project' : ' projects') +
      (bits.length ? ' — ' + bits.join(' · ') : '');
    W.$('#clear').hidden = !bits.length;
    W.$('#empty').hidden = list.length > 0;

    var spans = W.spans(list.length);
    W.$('#cards').innerHTML = list.map(function (p, i) {
      return '<a class="card rv in ' + spans[i] + '" href="' +
        W.url('work/case.html?p=' + encodeURIComponent(p.slug)) + '">' +
        '<div class="card-media">' + W.cover(p, i, 1200) + '</div>' +
        '<div class="card-body"><div class="card-top">' +
          '<span class="lab">' + W.t(p.client) + '</span><span class="lab">' + W.esc(p.year) + '</span></div>' +
        '<h3 class="h-card">' + W.t(p.title) + '</h3>' + W.tags(p.disciplines) + '</div></a>';
    }).join('');

    W.$('#rows').innerHTML = list.map(function (p, i) {
      return '<a class="row rv in" href="' + W.url('work/case.html?p=' + encodeURIComponent(p.slug)) + '">' +
        '<span class="row-thumb">' + W.cover(p, i, 200) + '</span>' +
        '<h3 class="row-title"><span class="row-client">' + W.t(p.client) + '</span>' + W.t(p.title) + '</h3>' +
        '<span class="row-meta">' + W.tags(p.disciplines) + '</span>' +
        '<span class="row-year">' + W.esc(p.year) + '</span>' +
        '<span class="row-arrow" aria-hidden="true"><svg width="15" height="11" viewBox="0 0 14 10" fill="none">' +
        '<path d="M9 1l4 4-4 4M13 5H0" stroke="currentColor" stroke-width="1.3"/></svg></span></a>';
    }).join('');
  }

  var listView = false;
  W.$('#view').addEventListener('click', function () {
    listView = !listView;
    this.setAttribute('aria-pressed', String(listView));
    this.textContent = listView ? 'Grid view' : 'List view';
    W.$('#cards').hidden = listView;
    W.$('#rows').hidden = !listView;
  });

  draw();
});
</script>
</body>
</html>
