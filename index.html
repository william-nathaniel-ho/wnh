<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WNH — Design &amp; Production</title>
<meta name="description" content="WNH is an independent design and production studio. Brand, film, motion, 3D and digital. Perth / Hong Kong.">
<meta property="og:title" content="WNH — Design &amp; Production">
<meta property="og:description" content="Independent design and production studio.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F1F0EC">
<link rel="preload" href="assets/fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body class="hero-dark">
<a class="skip" href="#work">Skip to work</a>
<div id="shell-nav"></div>

<main>
  <!-- HERO — paper panel riding over full-bleed media -->
  <section class="hero" id="top">
    <div class="hero-media">
      <div class="field" id="field"></div>
      <div class="grain" aria-hidden="true"></div>
    </div>
    <div class="hero-top">
      <div class="hero-cap lab lab-ink" id="hero-cap"></div>
    </div>
    <div class="hero-body">
      <div class="wrap">
        <div class="hero-panel">
          <p class="line" id="hero-line"></p>
          <div class="hero-meta lab" id="hero-meta"></div>
        </div>
      </div>
    </div>
    <div class="hero-cue">
      <span class="bar" aria-hidden="true"></span>
      <span class="lab lab-ink">Scroll</span>
    </div>
  </section>

  <!-- STATEMENT -->
  <section class="sec-tight">
    <div class="wrap two">
      <div class="lab rv in">Statement<br>&mdash; 001</div>
      <p class="statement rv" id="statement"></p>
    </div>
  </section>

  <!-- WORK -->
  <section class="sec-tight" id="work" style="padding-top:0">
    <div class="wrap">
      <div class="sec-head rv">
        <div>
          <div class="lab">Selected work</div>
          <h2 class="h-sec" style="margin-top:10px">Recent projects</h2>
        </div>
        <a class="pill" data-href="work/">
          <span>All work <span id="work-count"></span></span>
          <svg width="13" height="10" viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M9 1l4 4-4 4M13 5H0" stroke="currentColor" stroke-width="1.3"/></svg>
        </a>
      </div>
      <div class="bento" id="bento"></div>
    </div>
  </section>

  <!-- CAPABILITIES -->
  <section class="sec-tight" id="capabilities" style="padding-top:0">
    <div class="wrap">
      <div class="sec-head rv">
        <div>
          <div class="lab">Capabilities</div>
          <h2 class="h-sec" style="margin-top:10px">What the studio does</h2>
        </div>
      </div>
      <div class="caps" id="caps"></div>
    </div>
  </section>

  <!-- PROCESS — dark contrast panel -->
  <section class="sec-tight" style="padding-top:0">
    <div class="wrap">
      <div class="panel-ink rv" style="padding:clamp(32px,5vw,72px)">
        <div class="sec-head" style="margin-bottom:var(--s5)">
          <div>
            <div class="lab lab-ink">Process</div>
            <h2 class="h-sec" style="margin-top:10px">Four steps, no theatre</h2>
          </div>
        </div>
        <div class="steps" id="steps"></div>
      </div>
    </div>
  </section>

  <!-- CLIENTS -->
  <section aria-label="Selected clients" style="margin-bottom:var(--s6)">
    <div class="marq"><div class="marq-track" id="marq"></div></div>
  </section>

  <!-- STUDIO -->
  <section class="sec-tight" id="studio" style="padding-top:0">
    <div class="wrap studio">
      <div class="portrait rv"><div class="ph"></div></div>
      <div class="rv">
        <div class="lab">Studio &mdash; 002</div>
        <p class="statement" style="font-size:clamp(1.35rem,2.6vw,2.1rem);margin-top:var(--s3)" id="studio-copy"></p>
        <div class="avail"><i aria-hidden="true"></i><span id="avail"></span></div>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" style="border-top:1px solid var(--line)">
    <div class="wrap">
      <a class="cta-link" data-mailto href="#">Start a project</a>
      <div class="cta-foot">
        <a class="pill pill-solid" data-mail data-mailto href="#"></a>
        <span class="lab" id="cta-loc"></span>
      </div>
    </div>
  </section>
</main>

<div id="shell-foot"></div>
<script src="assets/js/site.js"></script>
<script>
WNH.boot(function (d) {
  var W = WNH, s = d.site || {};
  var featured = W.projects().filter(function (p) { return p.featured !== false; });

  W.$('#hero-line').textContent = s.tagline || '';
  W.$('#hero-cap').innerHTML = 'Brand &middot; Film &middot; Motion<br>3D &middot; Digital';
  W.$('#hero-meta').innerHTML =
    '<span>' + W.esc((s.locations || []).join(' / ')) + '</span>' +
    '<span>Reel 2026</span>';
  W.$('#statement').textContent = s.manifesto || '';
  W.$('#studio-copy').textContent = s.studioCopy || '';
  W.$('#avail').textContent = s.availability || '';
  W.$('#work-count').textContent = '(' + W.projects().length + ')';
  W.$('#cta-loc').textContent = (s.locations || []).join(' / ') + ' — reply within 2 working days';

  /* an even grid of identical cards reads as a catalogue, not a studio */
  W.$('#bento').innerHTML = featured.map(function (p, i) {
    var span = W.span(i);
    return '<a class="card rv ' + span + '" href="' +
      W.url('work/case.html?p=' + encodeURIComponent(p.slug)) + '">' +
      '<div class="card-media">' + W.cover(p, i, 1200) + '</div>' +
      '<div class="card-body">' +
        '<div class="card-top"><span class="lab">' + W.t(p.client) + '</span>' +
          '<span class="lab">' + W.esc(p.year) + '</span></div>' +
        '<h3 class="h-card">' + W.t(p.title) + '</h3>' +
        (span ? '<p class="card-sum">' + W.t(p.summary) + '</p>' : '') +
        W.tags(p.disciplines) +
      '</div></a>';
  }).join('');

  W.$('#caps').innerHTML = (d.capabilities || []).map(function (c, i) {
    return '<article class="cap rv"><span class="lab accent">' + W.pad(i + 1) + '</span>' +
      '<h3>' + W.t(c.title) + '</h3><p>' + W.t(c.summary) + '</p><ul>' +
      (c.items || []).map(function (x) { return '<li>' + W.t(x) + '</li>'; }).join('') + '</ul></article>';
  }).join('');

  W.$('#steps').innerHTML = (d.process || []).map(function (p) {
    return '<article class="step"><span class="n">' + W.esc(p.step) + '</span>' +
      '<h3>' + W.t(p.title) + '</h3><p>' + W.t(p.body) + '</p></article>';
  }).join('');

  var names = (d.clients || []);
  W.$('#marq').innerHTML = names.concat(names).map(function (n) {
    return '<span class="marq-item">' + W.t(n) + '</span>';
  }).join('');

  /* showreel behind the hero: Vimeo, then a Cloudinary mp4, else the field */
  var field = W.$('#field');
  if (s.reel && s.reel.vimeo && W.vimeoId(s.reel.vimeo)) {
    var f = document.createElement('iframe');
    f.src = W.vimeoSrc(s.reel.vimeo, true) + '&muted=1&loop=1&background=1';
    f.allow = 'autoplay; fullscreen';
    f.setAttribute('aria-hidden', 'true');
    f.title = 'Showreel';
    f.style.cssText = 'position:absolute;top:50%;left:50%;width:177.78vh;height:56.25vw;' +
      'min-width:100%;min-height:100%;transform:translate(-50%,-50%);border:0';
    field.replaceWith(f);
  } else if (s.reel && W.cld.ok(s.reel.video)) {
    var v = document.createElement('video');
    v.src = W.cld.video(s.reel.video);
    if (W.cld.ok(s.reel.poster)) v.poster = W.cld.poster(s.reel.poster);
    v.muted = v.loop = v.autoplay = v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.setAttribute('aria-hidden', 'true');
    field.replaceWith(v);
  }
});
</script>
</body>
</html>
