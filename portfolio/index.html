<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio — WNH</title>
<meta name="description" content="Selected work and capabilities — design direction, brand, film, motion, 3D and digital build.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F1F0EC">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
</head>
<body>
<a class="skip" href="#work">Skip to work</a>
<div id="shell-nav"></div>

<main>
  <!-- 1 — reel first -->
  <section class="case-hero">
    <div class="wrap">
      <div class="lab">Portfolio &mdash; <span data-year></span></div>
      <h1 class="case-title" style="max-width:14ch">Design <br>&amp; Production</h1>
      <p class="case-summary" id="pf-lead"></p>
      <div class="pf-roles" id="pf-roles"></div>
      <div id="pf-reel" style="margin-top:var(--s5)"></div>
    </div>
  </section>

  <!-- 2 — approach -->
  <section class="sec-tight">
    <div class="wrap two">
      <div class="lab">Approach<br>&mdash; 001</div>
      <p class="statement" id="pf-statement"></p>
    </div>
  </section>

  <!-- 3 — deep dives -->
  <section class="sec-tight" id="work" style="padding-top:0">
    <div class="wrap">
      <div class="sec-head rv">
        <div><div class="lab">Selected work</div>
          <h2 class="h-sec" style="margin-top:10px">In depth</h2></div>
      </div>
      <div class="deep" id="deep"></div>
    </div>
  </section>

  <!-- 4 — everything -->
  <section class="sec-tight" style="padding-top:0">
    <div class="wrap">
      <div class="sec-head rv">
        <div><div class="lab">Archive</div>
          <h2 class="h-sec" style="margin-top:10px">Everything</h2></div>
        <span class="lab" id="pf-count"></span>
      </div>
      <div class="filters" id="pf-filters" role="group" aria-label="Filter by discipline"></div>
      <div class="bento" id="pf-cards" style="margin-top:var(--s3)"></div>
    </div>
  </section>

  <!-- 5 — capabilities + toolkit -->
  <section class="sec-tight" style="padding-top:0">
    <div class="wrap">
      <div class="sec-head rv"><div><div class="lab">Capabilities</div>
        <h2 class="h-sec" style="margin-top:10px">What I lead</h2></div></div>
      <div class="caps" id="pf-caps"></div>
      <div class="sec-head rv" style="margin-top:var(--s6)"><div><div class="lab">Toolkit</div>
        <h2 class="h-sec" style="margin-top:10px">What I run it in</h2></div></div>
      <div class="tools" id="pf-tools"></div>
    </div>
  </section>

  <!-- 6 — contact -->
  <section style="border-top:1px solid var(--line)">
    <div class="wrap">
      <button class="cta-link" data-contact>Get in touch</button>
      <div class="cta-foot">
        <a class="pill pill-solid" data-mail data-mailto href="#"></a>
        <span class="lab" data-locations></span>
        <span class="lab" id="pf-note"></span>
      </div>
    </div>
  </section>
</main>

<div id="shell-foot"></div>
<script src="../assets/js/site.js"></script>
<script>
WNH.boot(function (d) {
  var W = WNH, s = d.site || {}, pf = s.portfolio || {};
  var all = W.projects();

  W.$('#pf-lead').textContent = pf.lead || s.tagline || '';
  /* the studio site speaks as 'we'; this page is one person, so it has
     its own statement rather than reusing the studio manifesto */
  W.$('#pf-statement').textContent = pf.statement || s.manifesto || '';
  W.$('#pf-note').textContent = pf.note || '';
  W.$('#pf-roles').innerHTML = (pf.roles || []).map(function (r) {
    return '<span>' + W.t(r) + '</span>';
  }).join('');

  var reel = W.$('#pf-reel');
  reel.innerHTML = (s.reel && s.reel.vimeo && W.vimeoId(s.reel.vimeo))
    ? '<div class="embed" data-vimeo="' + W.esc(s.reel.vimeo) + '" data-title="Showreel">' +
      '<div class="embed-facade" role="button" tabindex="0"><span class="play">' +
      '<svg width="11" height="13" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><path d="M0 0l12 7-12 7z"/></svg>' +
      ' Play reel</span></div></div>'
    : '<div class="embed"><div class="embed-facade">' +
      '<span class="play">Reel — add a Vimeo link in /admin</span></div></div>';

  var deep = all.filter(function (p) { return p.deep; });
  W.$('#deep').innerHTML = deep.map(function (p, i) {
    var href = W.url('work/case.html?p=' + encodeURIComponent(p.slug));
    return '<article class="deep-item rv">' +
      '<a class="deep-media" href="' + href + '">' + W.cover(p, i, 1440) + '</a>' +
      '<div class="deep-body">' +
        '<span class="lab">' + W.pad(i + 1) + ' &mdash; ' + W.t(p.client) + ' &middot; ' + W.esc(p.year) + '</span>' +
        '<h3><a href="' + href + '">' + W.t(p.title) + '</a></h3>' +
        '<p>' + W.t(p.summary) + '</p>' +
        '<div style="margin-top:var(--s3)">' + W.tags(p.disciplines) + '</div>' +
      '</div></article>';
  }).join('');

  var active = '';
  function drawCards() {
    var list = all.filter(function (p) { return !active || (p.disciplines || []).indexOf(active) > -1; });
    W.$('#pf-count').textContent = list.length + ' projects' + (active ? ' — ' + active : '');
    var spans = W.spans(list.length);
    W.$('#pf-cards').innerHTML = list.map(function (p, i) {
      return '<a class="card rv in ' + spans[i] + '" href="' + W.url('work/case.html?p=' + encodeURIComponent(p.slug)) + '">' +
        '<div class="card-media">' + W.cover(p, i, 960) + '</div>' +
        '<div class="card-body"><div class="card-top">' +
          '<span class="lab">' + W.t(p.client) + '</span><span class="lab">' + W.esc(p.year) + '</span></div>' +
        '<h3 class="h-card">' + W.t(p.title) + '</h3>' + W.tags(p.disciplines) + '</div></a>';
    }).join('');
  }
  W.$('#pf-filters').innerHTML =
    ['<button class="chip" data-d="" aria-pressed="true">All</button>']
    .concat(W.disciplines().map(function (x) {
      return '<button class="chip" data-d="' + W.esc(x) + '" aria-pressed="false">' + W.esc(x) + '</button>';
    })).join('');
  W.$('#pf-filters').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    active = b.dataset.d;
    W.$$('#pf-filters .chip').forEach(function (c) {
      c.setAttribute('aria-pressed', String(c.dataset.d === active));
    });
    drawCards();
  });
  drawCards();

  W.$('#pf-caps').innerHTML = (d.capabilities || []).map(function (c, i) {
    return '<article class="cap rv"><span class="lab accent">' + W.pad(i + 1) + '</span>' +
      '<h3>' + W.t(c.title) + '</h3><p>' + W.t(c.summary) + '</p><ul>' +
      (c.items || []).map(function (x) { return '<li>' + W.t(x) + '</li>'; }).join('') + '</ul></article>';
  }).join('');

  W.$('#pf-tools').innerHTML = (d.tools || []).map(function (t) {
    return '<div class="tool"><h4>' + W.t(t.title) + '</h4><p>' + W.t(t.body) + '</p></div>';
  }).join('');

  W.$$('.embed-facade').forEach(function (f) {
    f.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f.click(); }
    });
  });
});
</script>
</body>
</html>
