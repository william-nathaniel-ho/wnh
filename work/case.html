<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case study — WNH</title>
<meta name="theme-color" content="#08090A">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<a class="skip" href="#body">Skip to case study</a>
<div id="shell-nav"></div>

<main>
  <article id="case" hidden>
    <section class="case-hero">
      <div class="wrap">
        <a class="case-back" href="/work/">
          <svg width="14" height="10" viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M5 1L1 5l4 4M1 5h13" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>All work</span>
        </a>
        <div class="mono muted" style="margin-top:var(--s3)" id="c-client"></div>
        <h1 class="case-title" id="c-title"></h1>
        <p class="case-summary" id="c-summary"></p>
        <dl class="case-meta" id="c-meta"></dl>
      </div>
    </section>

    <section class="sec" id="body">
      <div class="wrap"><div class="blocks" id="c-blocks"></div></div>
    </section>

    <section class="sec" style="padding-top:0" id="c-credits-wrap" hidden>
      <div class="wrap">
        <div class="sec-head"><h2 class="sec-title">Cre<span class="n">dits</span></h2></div>
        <dl class="credits" id="c-credits"></dl>
      </div>
    </section>

    <div class="wrap"><a class="next" id="c-next" href="#">
      <span class="lbl">Next project</span><span class="t" id="c-next-title"></span>
    </a></div>

    <section class="cta" id="contact">
      <div class="wrap">
        <a class="cta-link" data-mailto href="#">Start<br><em>a</em> Project</a>
        <div class="cta-foot"><a class="cta-mail" data-mail href="#"></a>
          <span class="mono muted" data-locations></span></div>
      </div>
    </section>
  </article>

  <section class="sec" id="missing" hidden style="padding-top:calc(64px + var(--s6))">
    <div class="wrap">
      <h1 class="case-title">Not<br><span class="accent">found</span></h1>
      <p class="case-summary">That project isn't in the index.</p>
      <p style="margin-top:var(--s4)"><a class="link-arrow" href="/work/"><span>See all work</span>
        <svg width="14" height="10" viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M9 1l4 4-4 4M13 5H0" stroke="currentColor" stroke-width="1.4"/></svg></a></p>
    </div>
  </section>
</main>

<div id="shell-foot"></div>
<script src="/assets/js/site.js"></script>
<script>
WNH.boot(function (d) {
  var W = WNH;
  var slug = new URLSearchParams(location.search).get('p');
  var p = slug && W.project(slug);

  if (!p) { W.$('#missing').hidden = false; return; }
  W.$('#case').hidden = false;

  /* metadata first — it's what makes a case study read professional */
  document.title = p.title + ' — ' + p.client + ' — WNH';
  W.$('#c-client').innerHTML = W.t(p.client);
  W.$('#c-title').innerHTML = W.t(p.title);
  W.$('#c-summary').textContent = p.summary || '';

  W.$('#c-meta').innerHTML = [
    ['Client', W.t(p.client)],
    ['Year', W.esc(p.year)],
    ['Discipline', (p.disciplines || []).map(W.esc).join(', ')],
    ['Role', W.t(p.role || '—')]
  ].map(function (r) {
    return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>';
  }).join('');

  /* ---- block renderer. A closed set of types: adding a layout means adding
     one case here, never a new page. ---------------------------------------- */
  function media(src, alt, ratio) {
    if (W.cld.ok(src)) {
      return '<img src="' + W.cld.img(src, 1920) + '" srcset="' + W.cld.srcset(src) +
             '" sizes="100vw" alt="' + W.esc(alt || '') + '" loading="lazy" decoding="async">';
    }
    return '<div class="ph ratio-' + (ratio || '16x9') + '" data-tone="' + W.esc(p.tone || 'wine') +
           '"><span class="num">' + W.esc((alt || 'WNH').slice(0, 2).toUpperCase()) + '</span></div>';
  }
  function cap(text) { return text ? '<figcaption>' + W.t(text) + '</figcaption>' : ''; }

  var renderers = {
    text: function (b) {
      return '<div class="blk blk-text"><h2>' + W.t(b.heading || '') + '</h2><div>' +
        String(b.body || '').split(/\n{2,}/).map(function (para) {
          return '<p>' + W.t(para) + '</p>';
        }).join('') + '</div></div>';
    },
    image: function (b) {
      return '<figure class="blk ' + (b.size === 'wide' ? 'blk-wide' : 'blk-full') + '">' +
        '<div class="media">' + media(b.src, b.alt, b.ratio) + '</div>' + cap(b.caption) + '</figure>';
    },
    images: function (b) {
      var items = b.items || [];
      return '<figure class="blk"><div class="blk-images' + (items.length === 3 ? ' three' : '') + '">' +
        items.map(function (it) { return '<div class="media">' + media(it.src, it.alt, '4x5') + '</div>'; }).join('') +
        '</div>' + cap(b.caption) + '</figure>';
    },
    video: function (b) {
      if (!W.cld.ok(b.src)) return renderers.image({ src: '', alt: b.caption, caption: b.caption });
      return '<figure class="blk blk-full"><div class="media"><video src="' + W.cld.video(b.src) + '"' +
        (W.cld.ok(b.poster) ? ' poster="' + W.cld.poster(b.poster) + '"' : '') +
        ' controls playsinline preload="metadata"></video></div>' + cap(b.caption) + '</figure>';
    },
    vimeo: function (b) {
      var v = W.vimeoId(b.url);
      if (!v) {
        return '<figure class="blk blk-full"><div class="embed"><div class="embed-facade">' +
          '<span class="play">Vimeo link not set yet</span></div></div>' + cap(b.caption) + '</figure>';
      }
      /* facade, not an iframe — four players on one page is a slow page */
      return '<figure class="blk blk-full"><div class="embed" data-vimeo="' + W.esc(b.url) +
        '" data-title="' + W.esc(b.caption || p.title) + '"><div class="embed-facade" role="button" tabindex="0">' +
        '<span class="play"><svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true">' +
        '<path d="M0 0l12 7-12 7z"/></svg> Play</span></div></div>' + cap(b.caption) + '</figure>';
    },
    quote: function (b) {
      return '<div class="blk blk-quote"><blockquote>' + W.t(b.text || '') + '</blockquote>' +
        (b.attribution ? '<cite>' + W.t(b.attribution) + '</cite>' : '') + '</div>';
    },
    stats: function (b) {
      return '<div class="blk"><div class="blk-stats">' + (b.items || []).map(function (s) {
        return '<div class="stat"><b>' + W.t(s.value) + '</b><span>' + W.t(s.label) + '</span></div>';
      }).join('') + '</div></div>';
    }
  };

  W.$('#c-blocks').innerHTML = (p.blocks || []).map(function (b) {
    var fn = renderers[b.type];
    if (!fn) { console.warn('WNH: unknown block type', b.type); return ''; }
    return '<div class="rv">' + fn(b) + '</div>';
  }).join('');

  if ((p.credits || []).length) {
    W.$('#c-credits-wrap').hidden = false;
    W.$('#c-credits').innerHTML = p.credits.map(function (c) {
      return '<div class="credit"><dt>' + W.t(c.role) + '</dt><dd>' + W.t(c.name) + '</dd></div>';
    }).join('');
  }

  /* next project wraps round the index, so the page never dead-ends */
  var all = W.projects();
  var next = all[(all.indexOf(p) + 1) % all.length];
  W.$('#c-next').href = '/work/case.html?p=' + encodeURIComponent(next.slug);
  W.$('#c-next-title').innerHTML = W.t(next.title);

  /* keyboard parity for the video facades */
  W.$$('.embed-facade').forEach(function (f) {
    f.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f.click(); }
    });
  });
});
</script>
</body>
</html>
