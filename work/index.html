<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work — WNH</title>
<meta name="description" content="Selected work by WNH — brand, film, motion, 3D and digital.">
<meta name="theme-color" content="#F1F0EC">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="preload" id="preload" aria-hidden="true"><div class="pl-mark"></div></div>
<a class="skip" href="#list">Skip to list</a>
<div id="shell-nav"></div>

<main>
  <section class="case-hero">
    <div class="wrap">
      <div class="lab">Index &mdash; all work</div>
      <h1 class="case-title">Work</h1>
      <div class="filter-set">
        <div class="filter-row">
          <span class="lab filter-lab">Sector</span>
          <div class="filters" id="sectors" role="group" aria-label="Filter by sector"></div>
        </div>
        <div class="filter-row">
          <span class="lab filter-lab">Discipline</span>
          <div class="filters" id="filters" role="group" aria-label="Filter by discipline"></div>
        </div>
      </div>
      <div class="fbar" id="fbar">
        <button class="fpill" type="button" data-sheet="s">
          <span class="fpill-k">Sector</span><span class="fpill-v">All</span></button>
        <button class="fpill" type="button" data-sheet="d">
          <span class="fpill-k">Discipline</span><span class="fpill-v">All</span></button>
      </div>
      <div style="display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding-block:var(--s3)">
        <span class="lab" id="count"></span>
        <button class="chip" id="clear" hidden>Clear filters</button>
        <button class="chip" id="view" aria-pressed="false" style="margin-left:auto">List view</button>
      </div>
    </div>
  </section>

  <dialog class="fsheet" id="fsheet">
    <div class="fsheet-in">
      <div class="fsheet-grab" aria-hidden="true"></div>
      <header><h2 id="fsheet-t">Sector</h2>
        <button class="fsheet-x" id="fsheet-x" type="button" aria-label="Close">&times;</button></header>
      <div class="fsheet-list" id="fsheet-list"></div>
      <div class="fsheet-foot">
        <button class="btn btn-ghost" id="fsheet-clear" type="button">Clear</button>
        <button class="btn btn-solid" id="fsheet-done" type="button">Show all</button>
      </div>
    </div>
  </dialog>

  <section class="sec-tight" id="list" style="padding-top:var(--s3)">
    <div class="wrap">
      <div class="bento" id="cards"></div>
      <div class="rows" id="rows" hidden></div>
      <p class="empty" id="empty" hidden>No projects in that discipline.</p>
    </div>
  </section>

  <section id="contact" style="border-top:1px solid var(--line)">
    <div class="wrap">
      <button class="cta-link" data-contact>Start a project</button>
      <div class="cta-foot">
        <a class="pill pill-solid" data-mail data-mailto href="#"></a>
        <span class="lab" data-locations></span>
      </div>
    </div>
  </section>
</main>

<div id="shell-foot"></div>
<script src="../assets/js/site.js"></script>
<script>
WNH.boot(function (d) {
  var W = WNH;
  var all = W.projects();
  var q = new URLSearchParams(location.search);
  var active = q.get('d') || '';
  var sector = q.get('s') || '';

  /* two filters that combine, so "Health & Care" + "Brand" is one question
     rather than two separate views of the same list */
  function chips(host, values, current, key) {
    W.$(host).innerHTML =
      ['<button class="chip" data-v="" aria-pressed="' + (!current) + '">All</button>']
      .concat(values.map(function (x) {
        return '<button class="chip" data-v="' + W.esc(x) + '" aria-pressed="' +
               (current === x) + '">' + W.esc(x) + '</button>';
      })).join('');
    W.$(host).addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      if (key === 's') sector = b.dataset.v; else active = b.dataset.v;
      W.$$(host + ' .chip').forEach(function (c) {
        c.setAttribute('aria-pressed', String(c.dataset.v === (key === 's' ? sector : active)));
      });
      var u = new URL(location);
      sector ? u.searchParams.set('s', sector) : u.searchParams.delete('s');
      active ? u.searchParams.set('d', active) : u.searchParams.delete('d');
      history.replaceState(null, '', u);
      syncBar();
      draw();
    });
  }
  chips('#sectors', W.sectors(), sector, 's');
  chips('#filters', W.disciplines(2), active, 'd');

  /* ---------------------------------------------------------------- phone
     The same two questions, asked one at a time in a sheet. It writes to the
     same `sector` / `active` variables and calls the same draw(), so the two
     interfaces can never disagree. */
  var SHEET = {
    s: { title: 'Sector', values: W.sectors,
         count: function (v) { return all.filter(function (p) { return p.sector === v; }).length; } },
    d: { title: 'Discipline', values: function () { return W.disciplines(2); },
         count: function (v) {
           return all.filter(function (p) { return (p.disciplines || []).indexOf(v) > -1; }).length;
         } }
  };
  var dlg = W.$('#fsheet'), open = null;

  function matches(nextS, nextD) {
    return all.filter(function (p) {
      return (!nextS || p.sector === nextS) &&
             (!nextD || (p.disciplines || []).indexOf(nextD) > -1);
    }).length;
  }

  function syncBar() {
    W.$$('#fbar .fpill[data-sheet]').forEach(function (b) {
      var v = b.dataset.sheet === 's' ? sector : active;
      b.querySelector('.fpill-v').textContent = v || 'All';
      b.classList.toggle('on', !!v);
    });
  }

  function paintSheet() {
    var cfg = SHEET[open], cur = open === 's' ? sector : active;
    var tick = '<svg class="fopt-tick" viewBox="0 0 20 20" aria-hidden="true">' +
               '<path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    W.$('#fsheet-t').textContent = cfg.title;
    W.$('#fsheet-list').innerHTML =
      ['<button class="fopt" type="button" data-v="" aria-pressed="' + (!cur) + '">' + tick +
       'All' + '<span class="fopt-n">' + matches(open === 's' ? '' : sector, open === 'd' ? '' : active) +
       '</span></button>']
      .concat(cfg.values().map(function (x) {
        return '<button class="fopt" type="button" data-v="' + W.esc(x) + '" aria-pressed="' +
          (cur === x) + '">' + tick + W.esc(x) +
          '<span class="fopt-n">' +
          matches(open === 's' ? x : sector, open === 'd' ? x : active) + '</span></button>';
      })).join('');
    var n = matches(sector, active);
    W.$('#fsheet-done').textContent = 'Show ' + n + (n === 1 ? ' project' : ' projects');
    W.$('#fsheet-clear').disabled = !sector && !active;
  }

  function pushURL() {
    var u = new URL(location);
    sector ? u.searchParams.set('s', sector) : u.searchParams.delete('s');
    active ? u.searchParams.set('d', active) : u.searchParams.delete('d');
    history.replaceState(null, '', u);
  }

  /* keep the desktop chips in step, so switching orientation is seamless */
  function syncChips() {
    W.$$('#sectors .chip').forEach(function (c) {
      c.setAttribute('aria-pressed', String(c.dataset.v === sector));
    });
    W.$$('#filters .chip').forEach(function (c) {
      c.setAttribute('aria-pressed', String(c.dataset.v === active));
    });
  }

  W.$$('#fbar .fpill[data-sheet]').forEach(function (b) {
    b.addEventListener('click', function () {
      open = b.dataset.sheet;
      paintSheet();
      dlg.showModal();
    });
  });
  W.$('#fsheet-list').addEventListener('click', function (e) {
    var b = e.target.closest('.fopt'); if (!b) return;
    if (open === 's') sector = b.dataset.v; else active = b.dataset.v;
    pushURL(); syncChips(); syncBar(); paintSheet(); draw();
  });
  W.$('#fsheet-clear').addEventListener('click', function () {
    sector = ''; active = '';
    pushURL(); syncChips(); syncBar(); paintSheet(); draw();
  });
  W.$('#fsheet-done').addEventListener('click', function () { dlg.close(); });
  W.$('#fsheet-x').addEventListener('click', function () { dlg.close(); });
  /* Tapping the dimmed area closes it. Testing e.target against the dialog
     itself rather than walking up from it matters: choosing an option
     re-renders the list, which detaches the element that was clicked, and a
     detached node reports no ancestors — which would read as a backdrop tap
     and close the sheet on every choice. */
  dlg.addEventListener('click', function (e) {
    if (e.target === dlg) dlg.close();
  });

  W.$('#clear').addEventListener('click', function () {
    sector = ''; active = '';
    W.$$('.chip[data-v]').forEach(function (c) {
      c.setAttribute('aria-pressed', String(!c.dataset.v));
    });
    history.replaceState(null, '', location.pathname);
    syncBar();
    draw();
  });

  function draw() {
    var list = all.filter(function (p) {
      return (!sector || p.sector === sector) &&
             (!active || (p.disciplines || []).indexOf(active) > -1);
    });
    var bits = [sector, active].filter(Boolean);
    W.$('#count').textContent = list.length + (list.length === 1 ? ' project' : ' projects') +
      (bits.length ? ' — ' + bits.join(' · ') : '');
    W.$('#clear').hidden = !bits.length;
    W.$('#empty').hidden = list.length > 0;

    var spans = W.spans(list.length);
    W.$('#cards').innerHTML = list.map(function (p, i) {
      return '<a class="card rv in ' + spans[i] + '" href="' +
        W.url('work/case.html?p=' + encodeURIComponent(p.slug)) + '">' +
        '<div class="card-media">' + W.cover(p, i, 1200) + '</div>' +
        '<div class="card-body"><div class="card-top">' +
          '<span class="lab">' + W.t(p.client) + '</span><span class="lab">' + W.esc(p.year) + '</span></div>' +
        '<h3 class="h-card">' + W.t(p.title) + '</h3>' + W.tags(p.disciplines) + '</div></a>';
    }).join('');

    W.$('#rows').innerHTML = list.map(function (p, i) {
      return '<a class="row rv in" href="' + W.url('work/case.html?p=' + encodeURIComponent(p.slug)) + '">' +
        '<span class="row-thumb">' + W.cover(p, i, 200) + '</span>' +
        '<h3 class="row-title"><span class="row-client">' + W.t(p.client) + '</span>' + W.t(p.title) + '</h3>' +
        '<span class="row-meta">' + W.tags(p.disciplines) + '</span>' +
        '<span class="row-year">' + W.esc(p.year) + '</span>' +
        '<span class="row-arrow" aria-hidden="true"><svg width="15" height="11" viewBox="0 0 14 10" fill="none">' +
        '<path d="M9 1l4 4-4 4M13 5H0" stroke="currentColor" stroke-width="1.3"/></svg></span></a>';
    }).join('');
    W.imgloads();
  }

  var listView = false;
  W.$('#view').addEventListener('click', function () {
    listView = !listView;
    this.setAttribute('aria-pressed', String(listView));
    this.textContent = listView ? 'Grid view' : 'List view';
    W.$('#cards').hidden = listView;
    W.$('#rows').hidden = !listView;
  });

  syncBar();
  draw();
});
</script>
</body>
</html>
